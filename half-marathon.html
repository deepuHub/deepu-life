<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>try{var t=localStorage.getItem('deepu-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <title>Half Marathon — deepu-life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tracker-theme.css">
  <link rel="stylesheet" href="assets/css/timeline.css">
  <style>
    .page{padding:calc(var(--nav-h) + 2rem) 0 3rem}
    .page-head,.summary-strip,.list-section-label{padding-left:var(--pad);padding-right:var(--pad)}
    .page-head{max-width:820px;margin:0 auto 1.5rem}
    .sec-eyebrow{font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--plan);margin-bottom:0.4rem}
    .sec-title{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-0.03em;line-height:1}
    .sec-sub{margin-top:0.8rem;color:var(--muted);font-size:0.92rem;line-height:1.6;max-width:520px}
    .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}

    /* ── COUNTDOWN ── */
    .countdown-panel{position:relative;margin-top:1.75rem;padding:1.5rem clamp(1rem,4vw,2rem) 1.75rem;
      border:1px solid var(--plan-dim);border-radius:14px;overflow:hidden;
      background:radial-gradient(ellipse 130% 100% at 50% -10%, var(--plan-dim) 0%, var(--surface) 65%)}
    .countdown-eyebrow{display:flex;align-items:center;gap:0.7rem;font-size:0.68rem;letter-spacing:0.22em;
      text-transform:uppercase;color:var(--plan);margin-bottom:1.1rem;position:relative;z-index:1}
    .countdown-eyebrow::after{content:'';flex:1;height:1px;background:var(--plan-dim)}
    .countdown{display:flex;gap:clamp(0.3rem,2.5vw,1rem);flex-wrap:nowrap;position:relative;z-index:1}
    .cd-unit{flex:1;min-width:0;text-align:center}
    .cd-val{font-family:'Fraunces',serif;font-weight:900;line-height:1;color:var(--plan);
      font-size:clamp(1.7rem,7.5vw,3.4rem);letter-spacing:-0.03em;font-variant-numeric:tabular-nums;
      filter:drop-shadow(0 0 26px color-mix(in srgb, var(--plan) 55%, transparent))}
    .cd-lbl{font-size:clamp(0.52rem,1.6vw,0.62rem);letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-top:0.45rem}
    .cd-sec .cd-val{animation:cdPulse 1s ease-in-out infinite}
    @keyframes cdPulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @media(prefers-reduced-motion:reduce){.cd-sec .cd-val{animation:none}}
    .cd-done{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.3rem,4vw,2rem);color:var(--plan);text-align:center;position:relative;z-index:1}

    .summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0.5rem;max-width:820px;margin:1.5rem auto}
    .summary-chip{background:var(--surface);border:1px solid var(--border);padding:0.85rem 1rem;border-radius:6px;display:flex;flex-direction:column;gap:0.15rem}
    .chip-lbl{font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
    .chip-val{font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;line-height:1.1}

    .list-wrap{max-width:820px;margin:0 auto;padding-bottom:2rem}
    .week{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.1rem 1.3rem;margin-bottom:0.8rem}
    .week-hd{font-family:'Fraunces',serif;font-weight:700;font-size:0.95rem;margin-bottom:0.7rem;color:var(--plan)}
    .session{display:flex;gap:0.7rem;align-items:baseline;flex-wrap:wrap;padding:0.5rem 0 0.5rem 0.7rem;border-top:1px solid var(--border);border-left:3px solid var(--border);transition:border-color 0.2s}
    .session:first-of-type{border-top:none}
    .session.is-done{border-left-color:var(--success)}
    .session.is-skipped{border-left-color:var(--danger)}
    .session.is-planned{border-left-color:var(--border)}
    .s-daydate{width:4.2rem;flex-shrink:0;display:flex;flex-direction:column;gap:0.05rem}
    .s-day{color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em}
    .s-date{color:var(--muted);font-size:0.68rem}
    .s-type{font-weight:500;font-size:0.88rem;flex:1}

    .empty-st{color:var(--muted);font-size:0.85rem;padding:1rem 0 2rem;text-align:center}

    .sheets-btn{display:inline-flex;align-items:center;gap:0.45rem;padding:0.42rem 1rem;border-radius:999px;
      font-size:0.75rem;font-weight:500;letter-spacing:0.03em;border:1px solid var(--plan-dim);background:var(--plan-dim);
      color:var(--plan);text-decoration:none;transition:all 0.2s;white-space:nowrap}
    .sheets-btn:hover{background:var(--plan);color:#0a0f0d}
    .sync-badge{font-size:0.63rem;color:var(--muted);letter-spacing:0.06em;display:flex;align-items:center;gap:0.35rem;margin-top:0.5rem}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .sync-dot.ok{background:var(--success);box-shadow:0 0 6px var(--success)}
    .sync-dot.err{background:var(--danger)}
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">deepu<span>-life</span></a>
  <div class="nav-right">
    <div class="nav-pills">
      <a href="index.html" class="nav-pill">🏃 Tracker</a>
      <a href="todo.html" class="nav-pill">✅ To-Do</a>
      <a href="quotes.html" class="nav-pill">💬 Quotes</a>
      <a href="2026_school.html" class="nav-pill">🏫 School</a>
      <a href="health-private.html" class="nav-pill">🩺 Health</a>
      <a href="half-marathon.html" class="nav-pill active" aria-current="page">🏅 Half Marathon</a>
    </div>
    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">☀️</button>
  </div>
</nav>

<div class="page">
  <div class="page-head">
    <div class="head-row">
      <div>
        <p class="sec-eyebrow">Training</p>
        <h1 class="sec-title">Half Marathon.</h1>
        <p class="sec-sub">14-week build toward race day. Flip each session's <code>status</code> to <strong>done</strong> or <strong>skipped</strong> in Google Sheets as you go — this page just reflects it.</p>
        <div class="sync-badge" id="sync-badge"><span class="sync-dot"></span><span class="sync-label">Loading…</span></div>
      </div>
      <a id="sheets-link" href="#" target="_blank" class="sheets-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
        Add in Sheets
      </a>
    </div>
    <div class="countdown-panel" id="countdown-panel" style="display:none">
      <div class="countdown-eyebrow" id="countdown-eyebrow">🏅 Race day</div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>

  <div class="summary-strip" id="plan-sum"></div>
  <div id="plan-tv"></div>
  <div class="list-wrap">
    <div class="list-section-label">All Sessions</div>
    <div id="plan-body"></div>
  </div>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/timeline.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   Same Sheet, same Apps Script deployment as index.html —
   after pasting the updated AppScript.gs and redeploying,
   this reads the new "Plan" tab.
══════════════════════════════════════════════════════════ */
const GS_URL      = 'https://script.google.com/macros/s/AKfycbyJyCwv2hh4m5RHbVgaTOiInv8kgoyIppYlFlrqoYgOzF8hGBNEH6gyqtK7CI1ngm4eVQ/exec';
const GS_SHEET_ID = '1IqAAGq7i0MUtz1wwv23qfjjNGiIMIwigbpvK2zssUxE';

document.getElementById('sheets-link').href = `https://docs.google.com/spreadsheets/d/${GS_SHEET_ID}/edit`;

let PLAN = [];
let countdownTimer = null;

const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d) {
  if (!d) return '';
  const p = String(d).split('-');
  if (p.length !== 3) return d;
  return `${MO[+p[1]-1]} ${+p[2]}`;
}
function fmtFull(d) {
  if (!d) return '';
  const p = String(d).split('-');
  if (p.length !== 3) return d;
  return `${MO[+p[1]-1]} ${+p[2]}, ${p[0]}`;
}

function setSyncBadge(state, timeStr) {
  const badge = document.getElementById('sync-badge');
  const dot   = badge.querySelector('.sync-dot');
  const label = badge.querySelector('.sync-label');
  if (state === 'ok')  { dot.className='sync-dot ok';  label.textContent = `Synced ${timeStr}`; }
  if (state === 'err') { dot.className='sync-dot err'; label.textContent = 'Sync failed — showing demo data'; }
  if (state === 'loading') { dot.className='sync-dot'; label.textContent = 'Loading…'; }
}

async function gsGet() {
  if (!GS_URL) { loadDemoData(); return; }
  setSyncBadge('loading');
  try {
    const res  = await fetch(GS_URL + '?action=getAll', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    PLAN = data.plan || [];
    const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    setSyncBadge('ok', `at ${now}`);
    render();
  } catch (e) {
    setSyncBadge('err');
    loadDemoData();
  }
}

function loadDemoData() {
  PLAN = [
    {id:'1',week:'1',day:'Mon',type:'Recovery Run',target:'15:00 Recovery Run',status:'done',date:''},
    {id:'2',week:'1',day:'Wed',type:'Speed Run',target:'5:00 WU, 8×1:00 5K Pace, 1:00 rec',status:'done',date:''},
    {id:'3',week:'1',day:'Sat',type:'Long Run',target:'5K/3.1 Mile Run',status:'skipped',date:''},
    {id:'4',week:'2',day:'Mon',type:'Recovery Run',target:'15:00 Recovery Run',status:'planned',date:''},
    {id:'5',week:'2',day:'Wed',type:'Speed Run',target:'5:00 WU, 1:00 Mile, 2:00 5K, 3:00 10K, 2:00 5K, 1:00 Mile',status:'planned',date:''},
    {id:'6',week:'2',day:'Sat',type:'Long Run',target:'6.4K/4 Mile Run',status:'planned',date:''},
  ];
  render();
}

function statusBadge(status) {
  const s = (status || 'planned').toLowerCase();
  if (s === 'done')    return `<span class="badge b-done">Done ✓</span>`;
  if (s === 'skipped') return `<span class="badge b-fail">Skipped</span>`;
  return `<span class="badge b-neu">Planned</span>`;
}

function statusClass(status) {
  const s = (status || 'planned').toLowerCase();
  if (s === 'done')    return 'is-done';
  if (s === 'skipped') return 'is-skipped';
  return 'is-planned';
}

function groupByWeek(rows) {
  const map = new Map();
  rows.forEach(r => {
    const wk = r.week || '?';
    if (!map.has(wk)) map.set(wk, []);
    map.get(wk).push(r);
  });
  return [...map.entries()].sort((a, b) => (+a[0]) - (+b[0]));
}

/* ══════════════════════════════════════════════════════════
   CINEMATIC TIMELINE — reuses assets/js/timeline.js, the same
   engine driving Run/Read/Cycle on index.html.
══════════════════════════════════════════════════════════ */
const planCfg = {
  color: '#f0c94a', icon: '🏅',
  getDate: s => s.date,
  getBarH: s => s.type === 'Long Run' ? 3 : s.type === 'Speed Run' ? 2 : 1,
  makeMarkerVal: s => s.type === 'Long Run' ? 'LR' : s.type === 'Speed Run' ? 'SR' : 'RR',
  getTeaserTitle: s => s.type || '',
  makeSlide: s => `<div class="tl-slide-inner">
      <div class="tl-date">${s.day ? s.day.toUpperCase() + ' · ' : ''}Week ${s.week}${s.date ? ' · ' + fmtFull(s.date) : ''}</div>
      <div class="tl-headline" style="color:var(--plan)">${s.type || ''}</div>
      <div class="tl-meta">${statusBadge(s.status)}</div>
      ${s.target ? `<div class="tl-note">${s.target}</div>` : ''}
    </div>`,
};

function buildTimeline(sorted) {
  const startIdx = (() => {
    const i = sorted.findIndex(s => (s.status || 'planned').toLowerCase() === 'planned');
    return i === -1 ? sorted.length - 1 : i;
  })();
  tlBuild('plan', sorted, { ...planCfg, startIdx });
  tlSetActiveTab('plan');
}

/* ══════════════════════════════════════════════════════════
   LIVE COUNTDOWN — weeks/days/hours/min/sec to race day,
   read from the last (chronologically) Plan row with a date.
══════════════════════════════════════════════════════════ */
function startCountdown(sorted) {
  if (countdownTimer) clearInterval(countdownTimer);
  const panel = document.getElementById('countdown-panel');
  const withDates = sorted.filter(s => s.date);
  if (!withDates.length) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';
  const raceDay = withDates[withDates.length - 1].date;
  const target = new Date(raceDay + 'T00:00:00').getTime();
  document.getElementById('countdown-eyebrow').textContent = `🏅 Race day — ${fmtFull(raceDay)}`;

  function tick() {
    const el = document.getElementById('countdown');
    const diff = target - Date.now();
    if (diff <= 0) {
      el.innerHTML = `<div class="cd-done">🏅 Race day is here — go get it!</div>`;
      clearInterval(countdownTimer);
      return;
    }
    const sec = Math.floor(diff / 1000);
    const weeks = Math.floor(sec / (7*86400));
    const days  = Math.floor((sec % (7*86400)) / 86400);
    const hours = Math.floor((sec % 86400) / 3600);
    const mins  = Math.floor((sec % 3600) / 60);
    const secs  = sec % 60;
    el.innerHTML = [
      [weeks, 'Weeks'], [days, 'Days'], [hours, 'Hours'], [mins, 'Min'], [secs, 'Sec']
    ].map(([v, l], i) => `<div class="cd-unit${i===4?' cd-sec':''}"><div class="cd-val">${String(v).padStart(2,'0')}</div><div class="cd-lbl">${l}</div></div>`).join('');
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function render() {
  const sumEl  = document.getElementById('plan-sum');
  const bodyEl = document.getElementById('plan-body');

  if (!PLAN.length) {
    sumEl.innerHTML = '';
    document.getElementById('plan-tv').innerHTML = '';
    document.getElementById('countdown-panel').style.display = 'none';
    bodyEl.innerHTML = `<p class="empty-st">No plan yet — paste the 14-week schedule into the <strong>Plan</strong> tab in Google Sheets.</p>`;
    return;
  }

  const sorted = [...PLAN].sort((a, b) => (+a.id) - (+b.id));

  const done    = PLAN.filter(r => (r.status||'').toLowerCase() === 'done').length;
  const skipped = PLAN.filter(r => (r.status||'').toLowerCase() === 'skipped').length;
  const upcoming = PLAN.length - done - skipped;

  sumEl.innerHTML = `
    <div class="summary-chip"><span class="chip-lbl">Sessions</span><span class="chip-val">${PLAN.length}</span></div>
    <div class="summary-chip"><span class="chip-lbl">Done</span><span class="chip-val" style="color:var(--success)">${done}</span></div>
    <div class="summary-chip"><span class="chip-lbl">Skipped</span><span class="chip-val" style="color:var(--danger)">${skipped}</span></div>
    <div class="summary-chip"><span class="chip-lbl">Upcoming</span><span class="chip-val">${upcoming}</span></div>
  `;

  buildTimeline(sorted);
  startCountdown(sorted);

  bodyEl.innerHTML = groupByWeek(PLAN).map(([wk, sessions]) => `
    <div class="week">
      <div class="week-hd">Week ${wk}</div>
      ${sessions.map(s => `
        <div class="session ${statusClass(s.status)}">
          <span class="s-daydate">
            <span class="s-day">${s.day || ''}</span>
            <span class="s-date">${fmtDate(s.date) || '—'}</span>
          </span>
          <span class="s-type">${s.type || ''}</span>
          ${statusBadge(s.status)}
        </div>`).join('')}
    </div>`).join('');
}

gsGet();
</script>
</body>
</html>
