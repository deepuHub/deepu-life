<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <title>✅ To-Do — deepu-life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,300&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tracker-theme.css">
  <style>
    .tc{background:var(--danger);color:#fff;border-radius:999px;font-size:0.58rem;
      padding:0.05rem 0.32rem;font-weight:700;min-width:15px;text-align:center;line-height:1.4}

    /* PAGE SHELL */
    .page{padding-top:var(--nav-h);display:flex;flex-direction:column;min-height:100vh}

    /* CHECKLIST STRIP */
    .strip-wrap{background:var(--surface);border-bottom:1px solid var(--border);
      padding:0.55rem calc(1rem + var(--safe-r)) 0.55rem calc(1rem + var(--safe-l));
      overflow-x:auto;scrollbar-width:none}
    .strip-wrap::-webkit-scrollbar{display:none}
    .strip{display:flex;gap:0.35rem;align-items:center}
    .cl-btn{padding:0.3rem 0.75rem;border-radius:999px;font-size:0.73rem;font-weight:500;
      border:1px solid var(--border);color:var(--muted);background:var(--bg);cursor:pointer;
      white-space:nowrap;transition:all 0.16s;flex-shrink:0;font-family:'Epilogue',sans-serif;
      display:flex;align-items:center;gap:0.3rem;-webkit-tap-highlight-color:transparent}
    .cl-btn:hover{border-color:var(--muted);color:var(--text)}
    .cl-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
    .cl-btn.new-cl{border-style:dashed}
    .cl-btn.new-cl:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
    .cl-n{font-size:0.62rem;opacity:0.65}

    /* GLOBAL SUMMARY */
    .sum-section{padding:0.7rem calc(1rem + var(--safe-r)) 0.7rem calc(1rem + var(--safe-l));
      border-bottom:1px solid var(--border)}
    .sum-lbl{font-size:0.58rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:0.45rem}
    .sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.35rem}
    @media(max-width:340px){.sum-grid{grid-template-columns:repeat(2,1fr)}}
    .sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;
      padding:0.6rem 0.65rem;cursor:pointer;transition:all 0.16s;-webkit-tap-highlight-color:transparent;
      user-select:none}
    .sc:active{transform:scale(0.96)}
    .sc.on,.sc:hover{border-color:var(--accent);background:var(--accent-dim)}
    .sc.d.on,.sc.d:hover{border-color:var(--danger);background:var(--danger-dim)}
    .sc.w.on,.sc.w:hover{border-color:var(--warning);background:var(--warning-dim)}
    .sc.s.on,.sc.s:hover{border-color:var(--success);background:var(--success-dim)}
    .sc-val{font-family:'Fraunces',serif;font-weight:900;font-size:1.5rem;line-height:1;margin-bottom:0.1rem}
    .sc-lbl{font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
    .ca{color:var(--accent)}.cd{color:var(--danger)}.cw{color:var(--warning)}.cs{color:var(--success)}.cm{color:var(--muted)}

    /* CL HEADER */
    .cl-hd{padding:0.7rem calc(1rem + var(--safe-r)) 0 calc(1rem + var(--safe-l));
      display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
    .cl-hd-left{min-width:0;display:flex;align-items:baseline;gap:0.5rem}
    .cl-name{font-family:'Fraunces',serif;font-weight:900;font-size:1.35rem;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cl-prog{font-size:0.7rem;color:var(--muted);flex-shrink:0}
    .cl-hd-btns{display:flex;gap:0.3rem;flex-shrink:0}
    .ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
      background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;
      justify-content:center;font-size:0.8rem;transition:all 0.14s;-webkit-tap-highlight-color:transparent}
    .ib:hover{background:var(--surface2);color:var(--text)}
    .ib.d:hover{background:var(--danger-dim);color:var(--danger);border-color:var(--danger)}

    /* QUICK ADD */
    .qadd{padding:0.6rem calc(1rem + var(--safe-r)) 0.6rem calc(1rem + var(--safe-l));
      background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
    .eb{background:var(--warning-dim);border-radius:6px;padding:0.32rem 0.65rem;
      font-size:0.72rem;color:var(--warning);display:flex;align-items:center;gap:0.35rem;margin-bottom:0.45rem}
    .qa-row1{display:flex;gap:0.4rem}
    .qa-inp{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;
      padding:0.52rem 0.8rem;font-size:0.86rem;color:var(--text);font-family:'Epilogue',sans-serif;
      outline:none;transition:border-color 0.14s}
    .qa-inp:focus{border-color:var(--accent)}
    .qa-inp::placeholder{color:var(--muted)}
    .btn-add{padding:0.52rem 1rem;border-radius:8px;border:none;background:var(--accent);
      color:#0a0f0d;cursor:pointer;font-weight:600;font-size:0.8rem;font-family:'Epilogue',sans-serif;
      flex-shrink:0;transition:all 0.14s;-webkit-tap-highlight-color:transparent}
    .btn-add:active{transform:scale(0.96)}
    .btn-cx{padding:0.5rem 0.7rem;border-radius:8px;border:1px solid var(--border);
      background:transparent;color:var(--muted);cursor:pointer;font-size:0.72rem;
      font-family:'Epilogue',sans-serif;flex-shrink:0}
    .qa-row2{display:flex;gap:0.35rem;margin-top:0.4rem}
    .qa-sel,.qa-dt{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;
      padding:0.38rem 0.55rem;font-size:0.74rem;color:var(--text);font-family:'Epilogue',sans-serif;
      outline:none;color-scheme:dark;min-width:0}

    /* FILTERS */
    .frow-wrap{padding:0.5rem calc(1rem + var(--safe-r)) 0.4rem calc(1rem + var(--safe-l));
      display:flex;flex-direction:column;gap:0.35rem}
    .frow{display:flex;gap:0.3rem;overflow-x:auto;scrollbar-width:none;align-items:center}
    .frow::-webkit-scrollbar{display:none}
    .fp{padding:0.22rem 0.58rem;border-radius:999px;font-size:0.68rem;border:1px solid var(--border);
      color:var(--muted);background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;
      font-family:'Epilogue',sans-serif;transition:all 0.14s;-webkit-tap-highlight-color:transparent}
    .fp:hover{border-color:var(--muted);color:var(--text)}
    .fp.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
    .fp.ph.on{background:var(--danger-dim);border-color:var(--danger);color:var(--danger)}
    .fp.pm.on{background:var(--warning-dim);border-color:var(--warning);color:var(--warning)}
    .fp.pl.on{background:var(--success-dim);border-color:var(--success);color:var(--success)}
    .fsep{width:1px;background:var(--border);height:14px;flex-shrink:0;margin:0 0.1rem}
    .fsrch{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
      padding:0.4rem 0.8rem;font-size:0.8rem;color:var(--text);font-family:'Epilogue',sans-serif;
      outline:none;transition:border-color 0.14s;color-scheme:dark}
    .fsrch:focus{border-color:var(--accent)}
    .fsrch::placeholder{color:var(--muted)}

    /* TASK LIST */
    .tscroll{flex:1;overflow-y:auto;padding-bottom:calc(70px + var(--safe-b))}
    .tg-lbl{font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);
      padding:0.7rem calc(1rem + var(--safe-l)) 0.3rem;display:flex;align-items:center;gap:0.45rem}
    .tg-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
    .tul{list-style:none;padding:0 0.65rem 0 calc(0.65rem + var(--safe-l));display:flex;flex-direction:column;gap:0.3rem}

    /* SWIPE WRAP */
    .tw{position:relative;overflow:hidden;border-radius:10px}
    .sbg{position:absolute;inset:0;display:flex;align-items:center;border-radius:10px;pointer-events:none}
    .sbg-l{background:var(--danger-dim);justify-content:flex-end;padding-right:1.1rem}
    .sbg-r{background:var(--success-dim);justify-content:flex-start;padding-left:1.1rem}
    .sico{font-size:1rem;opacity:0;transition:opacity 0.12s}

    /* TASK ITEM */
    .ti{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0.55rem;
      padding:0.65rem 0.7rem;border-radius:10px;border:1px solid var(--border);
      background:var(--surface);position:relative;z-index:1;will-change:transform;
      transition:transform 0.26s cubic-bezier(0.4,0,0.2,1);-webkit-tap-highlight-color:transparent}
    .ti.ph{border-left:3px solid var(--danger)}
    .ti.pm{border-left:3px solid var(--warning)}
    .ti.pl{border-left:3px solid var(--success)}
    .ti.pn{border-left:3px solid var(--border)}
    .ti.dn{opacity:0.42}
    .tcb{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
    .tb{min-width:0;display:flex;flex-direction:column;gap:0.15rem}
    .tt{font-size:0.86rem;color:var(--text);word-break:break-word;line-height:1.33}
    .tt.dk{text-decoration:line-through;color:var(--muted)}
    .tm{display:flex;gap:0.3rem;flex-wrap:wrap;align-items:center;margin-top:0.05rem}
    .pp{padding:0.07rem 0.38rem;border-radius:999px;font-size:0.61rem;font-weight:500;flex-shrink:0}
    .pph{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(239,68,68,0.22)}
    .ppm{background:var(--warning-dim);color:var(--warning);border:1px solid rgba(240,168,60,0.22)}
    .ppl{background:var(--success-dim);color:var(--success);border:1px solid rgba(74,207,168,0.22)}
    .ppn{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
    .dl{font-size:0.66rem;color:var(--muted)}
    .dlo{color:var(--danger)}
    .edt{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;
      color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-size:0.72rem;flex-shrink:0;transition:all 0.12s}
    .edt:hover{background:var(--surface2);color:var(--text)}

    /* EMPTY */
    .empty{padding:3rem 1rem;text-align:center;color:var(--muted)}
    .empty-i{font-size:2.2rem;display:block;margin-bottom:0.6rem}
    .nosel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:0.6rem;color:var(--muted);padding:2rem;text-align:center}
    .nosel-big{font-family:'Fraunces',serif;font-weight:900;font-size:3rem;color:var(--border)}

    /* TRASH PANEL */
    .ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.65);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      display:flex;align-items:flex-end;animation:fi 0.2s ease}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    .pan{background:var(--surface);border-top:1px solid var(--border);
      border-radius:16px 16px 0 0;max-height:82vh;display:flex;flex-direction:column;
      width:100%;padding-bottom:calc(0.5rem + var(--safe-b));animation:su 0.26s cubic-bezier(0.4,0,0.2,1)}
    @keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .pan-hd{padding:0.9rem 1rem 0.7rem;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between}
    .pan-ttl{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem}
    .pan-x{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
      background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem}
    .pan-body{overflow-y:auto;padding:0.65rem;display:flex;flex-direction:column;gap:0.35rem}
    .tri{background:var(--bg);border:1px solid var(--border);border-radius:8px;
      padding:0.6rem 0.7rem;display:flex;align-items:center;gap:0.5rem}
    .tri-b{flex:1;min-width:0}
    .tri-t{font-size:0.83rem;color:var(--muted);word-break:break-word}
    .tri-m{font-size:0.63rem;color:var(--muted);margin-top:0.12rem}
    .tri-acts{display:flex;gap:0.25rem;flex-shrink:0}
    .trbtn{padding:0.25rem 0.55rem;border-radius:6px;border:1px solid var(--border);
      background:transparent;color:var(--muted);cursor:pointer;font-size:0.66rem;font-family:'Epilogue',sans-serif;transition:all 0.12s;-webkit-tap-highlight-color:transparent}
    .trbtn.rs:hover{background:var(--success-dim);color:var(--success);border-color:var(--success)}
    .trbtn.pd:hover{background:var(--danger-dim);color:var(--danger);border-color:var(--danger)}
    .etrash{padding:2rem;text-align:center;color:var(--muted);font-size:0.84rem}

    /* BOTTOM BAR */
    .bbar{position:fixed;bottom:0;left:0;right:0;z-index:100;
      display:flex;gap:0.4rem;
      padding:0.45rem calc(0.75rem + var(--safe-r)) calc(0.45rem + var(--safe-b)) calc(0.75rem + var(--safe-l));
      background:rgba(10,15,13,0.96);border-top:1px solid var(--border);backdrop-filter:blur(16px)}
    .bb{flex:1;padding:0.45rem;border-radius:8px;border:1px solid var(--border);
      background:transparent;color:var(--muted);cursor:pointer;font-size:0.7rem;
      font-family:'Epilogue',sans-serif;transition:all 0.14s;display:flex;align-items:center;
      justify-content:center;gap:0.3rem;-webkit-tap-highlight-color:transparent}
    .bb:hover{background:var(--surface2);color:var(--text)}

    @media(min-width:768px){
      :root{--nav-h:60px}
      .tscroll{padding-bottom:60px}
      .bbar{position:static;padding:0.6rem 1rem;border-top:1px solid var(--border)}
      .bb{flex:0 0 auto;padding:0.38rem 0.85rem}
    }
  </style>
</head>

<div class="page">

  <!-- global summary -->
  <div class="sum-section">
    <div class="sum-lbl">All checklists — tap to filter</div>
    <div class="sum-grid" id="sum-grid"></div>
  </div>

  <!-- main -->
  <div style="display:flex;flex-direction:column;flex:1;overflow:hidden" id="main">

    <div class="nosel" id="nosel">
      <div class="nosel-big">✅</div>
      <p style="font-size:0.88rem">Pick or create a checklist above</p>
    </div>

    <div id="clv" style="display:none;flex-direction:column;flex:1;overflow:hidden">

      <!-- header -->
      <div class="cl-hd">
        <div class="cl-hd-left">
          <div class="cl-name" id="cl-name">—</div>
          <div class="cl-prog" id="cl-prog"></div>
        </div>
        <div class="cl-hd-btns">

      <!-- quick add -->
      <div class="qadd">

        <div class="qa-row1">
          <input class="qa-inp" id="qa-t" type="text" placeholder="New task… press Enter to save"/>
          <button class="btn-add" id="btn-add">Add</button>
          <button class="btn-cx" id="btn-cx" style="display:none">✕</button>
        </div>
        <div class="qa-row2">
          <select class="qa-sel" id="qa-p">
            <option value="none">No priority</option>

      <!-- filters -->

          <button class="fp on" data-s="all">All</button>
          <button class="fp" data-s="incomplete">Pending</button>
          <button class="fp" data-s="completed">Done</button>
          <div class="fsep"></div>
          <button class="fp on" data-p="all">All pri</button>
          <button class="fp ph" data-p="high">🔴 High</button>
          <button class="fp pm" data-p="medium">🟡 Med</button>
          <button class="fp pl" data-p="low">🟢 Low</button>
        </div>
        <input class="fsrch" id="fsrch" type="search" placeholder="Search tasks…"/>
      </div>

      <!-- tasks -->
      <div class="tscroll" id="tscroll">
        <div class="empty" id="tempty" style="display:none"><span class="empty-i">🎉</span>Nothing here — add a task above.</div>
        <div id="tlists"></div>
      </div>
    </div>
  </div>

  <!-- bottom bar -->
  <div class="bbar">
    <button class="bb" id="btn-exp">⇩ Export</button>
    <button class="bb" id="btn-imp">⇧ Import</button>
    <input type="file" id="fimp" accept="application/json" style="display:none">
  </div>
</div>

<script>
(function(){
  const KEY="localTodoManagerState_v1";
  let S={checklists:[],selectedChecklistId:null,trash:[],filters:{status:"all",priority:"all",search:""}};
  let editId=null;
  const $=id=>document.getElementById(id);

  /* ── PERSISTENCE ── */
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function load(){
    try{
      const r=localStorage.getItem(KEY);if(!r)return;
      const p=JSON.parse(r);
      if(p&&Array.isArray(p.checklists)){
        S={checklists:p.checklists||[],selectedChecklistId:p.selectedChecklistId||null,
          trash:p.trash||[],filters:Object.assign({status:"all",priority:"all",search:""},p.filters||{})};
      }
    }catch(e){}
  }
  function uid(x){return x+'_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
  function mkCL(n){return{id:uid('cl'),name:n||'New Checklist',createdAt:new Date().toISOString(),tasks:[]}}
  function mkT(title,due,pri){return{id:uid('ts'),title:title.trim(),dueDate:due||null,priority:pri||'none',completed:false,createdAt:new Date().toISOString(),completedAt:null}}
  function today(){return new Date().toISOString().slice(0,10)}
  function getCL(){return S.checklists.find(c=>c.id===S.selectedChecklistId)||null}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  function ensureInit(){
    if(!S.checklists.length){
      const cl=mkCL('My Tasks');
      cl.tasks.push(mkT('Welcome to deepu-life To-Do',null,'medium'));
      cl.tasks.push(mkT('Swipe left to trash a task',null,'low'));
      cl.tasks.push(mkT('Swipe right to complete a task',null,'low'));
      S.checklists.push(cl);S.selectedChecklistId=cl.id;
    }else if(!S.selectedChecklistId&&S.checklists[0]){S.selectedChecklistId=S.checklists[0].id}
    if(!Array.isArray(S.trash))S.trash=[];
  }

  /* ── FILTERS ── */
  function applyF(tasks){
    const {status,priority,search}=S.filters;
    const q=(search||'').toLowerCase().trim();
    return tasks.filter(t=>{
      if(status==='completed'&&!t.completed)return false;
      if(status==='incomplete'&&t.completed)return false;
      if(priority!=='all'&&t.priority!==priority)return false;
      if(q&&!t.title.toLowerCase().includes(q))return false;
      return true;
    });
  }

  /* ── GLOBAL STATS ── */
  function gStats(){
    let pending=0,high=0,overdue=0,done=0;
    S.checklists.forEach(cl=>cl.tasks.forEach(t=>{
      if(t.completed){done++;}else{
        pending++;
        if(t.priority==='high')high++;
        if(t.dueDate&&t.dueDate<today())overdue++;
      }
    }));
    return{pending,high,overdue,done};
  }

  /* ── RENDER STRIP ── */
  function rStrip(){
    const el=$('strip');el.innerHTML='';
    S.checklists.forEach(cl=>{
      const pend=cl.tasks.filter(t=>!t.completed).length;
      const b=document.createElement('button');
      b.className='cl-btn'+(cl.id===S.selectedChecklistId?' active':'');
      b.innerHTML=`${esc(cl.name)} <span class="cl-n">${pend}</span>`;
      b.onclick=()=>{S.selectedChecklistId=cl.id;clearForm();save();rAll();};
      el.appendChild(b);
    });
    const nb=document.createElement('button');
    nb.className='cl-btn new-cl';nb.textContent='＋ New';nb.onclick=newCL;
    el.appendChild(nb);
  }

  /* ── RENDER SUMMARY ── */
  function rSum(){
    const g=gStats();
    const grid=$('sum-grid');grid.innerHTML='';
    const cards=[
      {v:g.pending,l:'Pending',cls:'',   sc:'ca',fs:{status:'incomplete',priority:'all'}},
      {v:g.high,   l:'High',   cls:'d',  sc:'cd',fs:{status:'incomplete',priority:'high'}},
      {v:g.overdue,l:'Overdue',cls:'d',  sc:'cd',fs:{status:'incomplete',priority:'all',ov:true}},
      {v:g.done,   l:'Done',   cls:'s',  sc:'cs',fs:{status:'completed', priority:'all'}},
    ];
    cards.forEach(c=>{
      const isOn=c.fs.status===S.filters.status&&c.fs.priority===S.filters.priority;
      const d=document.createElement('div');
      d.className=`sc ${c.cls}${isOn?' on':''}`;
      d.innerHTML=`<div class="sc-val ${c.sc}">${c.v}</div><div class="sc-lbl">${c.l}</div>`;
      d.onclick=()=>{
        S.filters.status=c.fs.status;S.filters.priority=c.fs.priority;
        if(!getCL()&&S.checklists.length)S.selectedChecklistId=S.checklists[0].id;
        syncFUI();save();rAll();
        $('tscroll')?.scrollTo({top:0,behavior:'smooth'});
      };
      grid.appendChild(d);
    });
  }

  /* ── RENDER HEADER ── */
  function rHdr(){
    const cl=getCL();if(!cl)return;
    const done=cl.tasks.filter(t=>t.completed).length;
    $('cl-name').textContent=cl.name;
    $('cl-prog').textContent=`${done}/${cl.tasks.length}`;
  }

  /* ── RENDER TASKS ── */
  function rTasks(){
    const cl=getCL();
    const con=$('tlists');con.innerHTML='';
    if(!cl){$('tempty').style.display='block';return;}
    const filtered=applyF(cl.tasks);
    const pend=filtered.filter(t=>!t.completed);
    const done=filtered.filter(t=>t.completed);
    if(!filtered.length){$('tempty').style.display='block';return;}
    $('tempty').style.display='none';
    if(pend.length)con.appendChild(mkGrp(pend,cl,`${pend.length} pending`));
    if(done.length)con.appendChild(mkGrp(done,cl,`${done.length} done`));
  }

  function mkGrp(tasks,cl,label){
    const f=document.createDocumentFragment();
    const lb=document.createElement('div');lb.className='tg-lbl';lb.textContent=label;f.appendChild(lb);
    const ul=document.createElement('ul');ul.className='tul';
    tasks.forEach(t=>ul.appendChild(mkTWrap(t,cl)));
    f.appendChild(ul);return f;
  }

  function mkTWrap(task,cl){
    const li=document.createElement('li');
    const bgL=document.createElement('div');bgL.className='sbg sbg-l';
    bgL.innerHTML='<span class="sico" data-ico="del">🗑</span>';
    const bgR=document.createElement('div');bgR.className='sbg sbg-r';
    bgR.innerHTML='<span class="sico" data-ico="done">'+(task.completed?'↩':'✓')+'</span>';
    const wrap=document.createElement('div');wrap.className='tw';
    wrap.appendChild(bgL);wrap.appendChild(bgR);wrap.appendChild(mkTEl(task,cl));
    li.appendChild(wrap);
    initSwipe(wrap,task,cl);
    return li;
  }

  function mkTEl(task,cl){
    const pc={high:'ph',medium:'pm',low:'pl',none:'pn'}[task.priority]||'pn';
    const ppc={high:'pph',medium:'ppm',low:'ppl',none:'ppn'}[task.priority]||'ppn';
    const ppl={high:'High',medium:'Med',low:'Low',none:'—'}[task.priority]||'—';
    const ov=!task.completed&&task.dueDate&&task.dueDate<today();
    const el=document.createElement('div');
    el.className=`ti ${pc}${task.completed?' dn':''}`;
    el.innerHTML=`
      <input type="checkbox" class="tcb"${task.completed?' checked':''}/>
      <div class="tb">
        <div class="tt${task.completed?' dk':''}">${esc(task.title)}</div>
        <div class="tm">
          <span class="pp ${ppc}">${ppl}</span>
          ${task.dueDate?`<span class="dl${ov?' dlo':''}">📅 ${task.dueDate}</span>`:''}
        </div>
      </div>
      <button class="edt" title="Edit">✎</button>`;
    el.querySelector('.tcb').onchange=e=>{
      task.completed=e.target.checked;task.completedAt=task.completed?new Date().toISOString():null;
      save();rAll();
    };
    el.querySelector('.edt').onclick=e=>{e.stopPropagation();startEdit(task.id);};
    return el;
  }

  /* ── SWIPE ── */
  function initSwipe(wrap,task,cl){
    const THR=68;
    let sx=0,sy=0,cx=0,axis=null,active=false;
    const item=wrap.querySelector('.ti');
    const iDel=wrap.querySelector('[data-ico="del"]');
    const iDone=wrap.querySelector('[data-ico="done"]');

    function onS(e){
      const t=e.touches?e.touches[0]:e;
      sx=t.clientX;sy=t.clientY;cx=0;axis=null;active=true;
      item.style.transition='none';
    }
    function onM(e){
      if(!active)return;
      const t=e.touches?e.touches[0]:e;
      const dx=t.clientX-sx,dy=t.clientY-sy;
      if(!axis)axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      if(axis==='y')return;
      e.preventDefault();cx=dx;
      const pct=Math.min(Math.abs(cx)/THR,1);
      item.style.transform=`translateX(${cx}px)`;
      if(iDel)iDel.style.opacity=cx<0?pct:0;
      if(iDone)iDone.style.opacity=cx>0?pct:0;
    }
    function onE(){
      if(!active)return;active=false;
      item.style.transition='';
      if(iDel)iDel.style.opacity=0;if(iDone)iDone.style.opacity=0;
      if(cx<-THR){
        item.style.transform='translateX(-110%)';
        setTimeout(()=>{trashTask(cl,task.id);save();rAll();},220);
      }else if(cx>THR){
        task.completed=!task.completed;task.completedAt=task.completed?new Date().toISOString():null;
        item.style.transform='translateX(0)';save();rAll();
      }else{item.style.transform='translateX(0)';}
      cx=0;axis=null;
    }
    wrap.addEventListener('touchstart',onS,{passive:true});
    wrap.addEventListener('touchmove',onM,{passive:false});
    wrap.addEventListener('touchend',onE);
    wrap.addEventListener('mousedown',onS);
    wrap.addEventListener('mousemove',onM);
    wrap.addEventListener('mouseup',onE);
    wrap.addEventListener('mouseleave',()=>{if(active){cx=0;onE();}});
  }

  /* ── TRASH ── */
  function trashTask(cl,taskId){
    const i=cl.tasks.findIndex(t=>t.id===taskId);if(i===-1)return;
    const[t]=cl.tasks.splice(i,1);
    S.trash.push({...t,_fc:cl.id,_fn:cl.name,_ta:new Date().toISOString()});
  }

  function rTC(){
    const n=S.trash.length;const e=$('tc');e.textContent=n;e.style.display=n?'inline':'none';
  }

  function openTrash(){
    closeTrash();
    const ov=document.createElement('div');ov.className='ov';ov.id='tov';
    ov.onclick=e=>{if(e.target===ov)closeTrash();};
    const pan=document.createElement('div');pan.className='pan';
    const hd=document.createElement('div');hd.className='pan-hd';
    hd.innerHTML=`<div class="pan-ttl" id="pan-ttl">🗑 Trash (${S.trash.length})</div>`;
    const xb=document.createElement('button');xb.className='pan-x';xb.textContent='✕';xb.onclick=closeTrash;
    hd.appendChild(xb);
    const body=document.createElement('div');body.className='pan-body';body.id='tbody';
    pan.appendChild(hd);pan.appendChild(body);ov.appendChild(pan);
    document.body.appendChild(ov);
    rTBody(body);
  }

  function rTBody(body){
    body.innerHTML='';
    if(!S.trash.length){body.innerHTML='<div class="etrash">Trash is empty 🎉</div>';return;}
    [...S.trash].reverse().forEach((t,ri)=>{
      const realIdx=S.trash.length-1-ri;
      const el=document.createElement('div');el.className='tri';
      el.innerHTML=`
        <div class="tri-b">
          <div class="tri-t">${esc(t.title)}</div>
          <div class="tri-m">From: ${esc(t._fn||'?')} · ${(t._ta||'').slice(0,10)}</div>
        </div>
        <div class="tri-acts">
          <button class="trbtn rs">Restore</button>
          <button class="trbtn pd">Delete</button>
        </div>`;
      el.querySelector('.rs').onclick=()=>{
        const item=S.trash.splice(realIdx,1)[0];
        const tgt=S.checklists.find(c=>c.id===item._fc)||getCL();
        if(tgt){const{_fc,_fn,_ta,...clean}=item;tgt.tasks.push(clean);}
        save();rAll();rFresh();
      };
      el.querySelector('.pd').onclick=()=>{
        if(!confirm('Permanently delete?'))return;
        S.trash.splice(realIdx,1);save();rAll();rFresh();
      };
      body.appendChild(el);
    });
  }

  function rFresh(){
    const b=$('tbody');if(b)rTBody(b);
    const h=$('pan-ttl');if(h)h.textContent=`🗑 Trash (${S.trash.length})`;
  }

  function closeTrash(){$('tov')?.remove();}

  /* ── FORM ── */
  function clearForm(){
    editId=null;$('qa-t').value='';$('qa-d').value='';$('qa-p').value='none';
    $('btn-add').textContent='Add';$('btn-cx').style.display='none';$('eban').style.display='none';
  }
  function startEdit(taskId){
    const cl=getCL();if(!cl)return;
    const t=cl.tasks.find(x=>x.id===taskId);if(!t)return;
    editId=taskId;$('qa-t').value=t.title;$('qa-d').value=t.dueDate||'';$('qa-p').value=t.priority||'none';
    $('btn-add').textContent='Save';$('btn-cx').style.display='inline-block';$('eban').style.display='flex';
    $('qa-t').focus();$('tscroll').scrollTo({top:0,behavior:'smooth'});
  }
  function handleAdd(){
    const cl=getCL();if(!cl){alert('Select a checklist first.');return;}
    const title=$('qa-t').value.trim();if(!title){$('qa-t').focus();return;}
    const due=$('qa-d').value||null,pri=$('qa-p').value||'none';
    if(editId){const t=cl.tasks.find(x=>x.id===editId);if(t){t.title=title;t.dueDate=due;t.priority=pri;}}
    else cl.tasks.push(mkT(title,due,pri));
    save();clearForm();rAll();
  }

  /* ── CL ACTIONS ── */
  function newCL(){
    const n=prompt('Checklist name:','New Checklist');if(!n)return;
    const cl=mkCL(n);S.checklists.push(cl);S.selectedChecklistId=cl.id;save();clearForm();rAll();
  }

  /* ── SYNC FILTER UI ── */
  function syncFUI(){
    document.querySelectorAll('#frow [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===S.filters.status));
    document.querySelectorAll('#frow [data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===S.filters.priority));
    $('fsrch').value=S.filters.search||'';
  }

  /* ── VISIBILITY ── */
  function rVis(){
    const cl=getCL();
    $('nosel').style.display=cl?'none':'flex';
    $('clv').style.display=cl?'flex':'none';
  }

  /* ── EXPORT/IMPORT ── */
  function doExport(){
    const blob=new Blob([JSON.stringify(JSON.parse(JSON.stringify(S)),null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='deepu-todo-data.json';document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
  }
  function validShape(p){
    if(!p||typeof p!=='object')return false;if(!Array.isArray(p.checklists))return false;
    if(!p.filters||typeof p.filters!=='object')return false;
    for(const cl of p.checklists){
      if(!cl||typeof cl!=='object')return false;
      if(typeof cl.id!=='string'||typeof cl.name!=='string')return false;
      if(!Array.isArray(cl.tasks))return false;
      for(const t of cl.tasks){
        if(!t||typeof t!=='object')return false;
        if(typeof t.id!=='string'||typeof t.title!=='string')return false;
        if(!['high','medium','low','none'].includes(t.priority))return false;
        if(typeof t.completed!=='boolean')return false;
      }
    }
    return true;
  }
  function doImport(file){
    const r=new FileReader();
    r.onload=e=>{
      try{
        const p=JSON.parse(e.target.result);if(!validShape(p))throw 0;
        S={checklists:p.checklists||[],selectedChecklistId:p.selectedChecklistId||null,
          trash:p.trash||[],filters:Object.assign({status:'all',priority:'all',search:''},p.filters||{})};
        ensureInit();save();clearForm();rAll();alert('Imported successfully.');
      }catch(e){alert('Invalid file format.');}
      finally{$('fimp').value='';}
    };
    r.onerror=()=>{alert('Could not read file.');$('fimp').value='';};
    r.readAsText(file,'utf-8');
  }

  /* ── FULL RENDER ── */
  function rAll(){rStrip();rSum();rTC();rVis();rHdr();syncFUI();rTasks();}

  /* ── EVENTS ── */
  $('btn-add').onclick=handleAdd;
  $('qa-t').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleAdd();}});
  $('btn-cx').onclick=clearForm;
  $('btn-ren').onclick=()=>{
    const cl=getCL();if(!cl)return;const n=prompt('Rename:',cl.name);if(!n)return;
    cl.name=n.trim()||'Untitled';save();rAll();
  };
  $('btn-dcl').onclick=()=>{
    const cl=getCL();if(!cl)return;
    if(!confirm(`Delete "${cl.name}"? Tasks go to Trash.`))return;
    cl.tasks.forEach(t=>S.trash.push({...t,_fc:cl.id,_fn:cl.name,_ta:new Date().toISOString()}));
    S.checklists.splice(S.checklists.findIndex(c=>c.id===cl.id),1);
    S.selectedChecklistId=S.checklists[0]?.id||null;
    clearForm();save();rAll();
  };
  $('btn-trash').onclick=openTrash;
  document.querySelectorAll('#frow [data-s]').forEach(b=>b.onclick=()=>{S.filters.status=b.dataset.s;syncFUI();save();rAll();});
  document.querySelectorAll('#frow [data-p]').forEach(b=>b.onclick=()=>{S.filters.priority=b.dataset.p;syncFUI();save();rAll();});
  $('fsrch').oninput=()=>{S.filters.search=$('fsrch').value;save();rTasks();};
  $('btn-exp').onclick=doExport;
  $('btn-imp').onclick=()=>$('fimp').click();
  $('fimp').onchange=()=>{const f=$('fimp').files?.[0];if(f)doImport(f);};

  /* ── INIT ── */
  load();ensureInit();rAll();
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
