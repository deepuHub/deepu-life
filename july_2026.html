<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cafeteria Menu · July 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --sky-dawn:   #fdf4e7;
    --sky-mid:    #fce8c3;
    --sky-noon:   #f9dba0;
    --accent:     #e07b2a;
    --accent2:    #c0392b;
    --text:       #2c1a0e;
    --muted:      #8b6f5c;
    --line:       #e8c99a;
    --card-bg:    rgba(255,255,255,0.88);
    --radius:     16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(175deg, var(--sky-dawn) 0%, var(--sky-mid) 40%, var(--sky-noon) 100%);
    min-height: 100vh;
    color: var(--text);
  }

  /* HEADER */
  .header { padding: 28px 20px 16px; text-align: center; }
  .header-sun { font-size: 2.4rem; display: block; animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .header h1 { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; line-height: 1.1; margin-top: 6px; }
  .header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .header .notice { display: inline-block; margin-top: 10px; font-size: 0.75rem; color: #8a6200; background: linear-gradient(135deg,#fff3cd,#ffe8a1); border: 1px solid #f5c842; border-radius: 999px; padding: 4px 12px; }

  /* JAIN TOGGLE */
  .jain-toggle-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 0 12px; }
  .jain-label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
  .toggle { position: relative; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 999px; cursor: pointer; transition: 0.3s; }
  .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
  .toggle input:checked + .toggle-slider { background: #4caf50; }
  .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

  /* WEEK TABS */
  .week-tabs { display: flex; gap: 6px; padding: 10px 20px 0; overflow-x: auto; scrollbar-width: none; }
  .week-tabs::-webkit-scrollbar { display: none; }
  .week-tab { flex: 0 0 auto; font-size: 0.75rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card-bg); color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .week-tab.active { background: var(--text); border-color: var(--text); color: #fff; }

  /* DAY SELECTOR */
  .day-selector { display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px 4px; scrollbar-width: none; }
  .day-selector::-webkit-scrollbar { display: none; }
  .day-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; background: var(--card-bg); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px 8px; cursor: pointer; transition: all 0.2s ease; min-width: 58px; }
  .day-btn .d-name { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .day-btn .d-num { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 800; color: var(--text); line-height: 1; margin: 2px 0; }
  .day-btn .d-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .day-btn.active { background: var(--accent); border-color: var(--accent); }
  .day-btn.active .d-name, .day-btn.active .d-num { color: #fff; }
  .day-btn.active .d-dot { background: rgba(255,255,255,0.7); }
  .day-btn.today-btn { border-color: var(--accent); }
  .day-btn.today-btn .d-dot { background: var(--accent); }

  /* CONTENT */
  .content-wrap { padding: 16px 16px 40px; max-width: 640px; margin: 0 auto; }
  .date-label { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: var(--accent); margin-bottom: 16px; padding-left: 2px; }

  .meal-card { background: var(--card-bg); border-radius: var(--radius); padding: 16px 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 14px; }
  .meal-title { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .meal-card.breakfast { border-left: 4px solid #e07b2a; }
  .meal-card.eybrunch { border-left: 4px solid #16a085; }
  .meal-card.lunch { border-left: 4px solid #2ecc71; }
  .meal-card.snack { border-left: 4px solid #e91e8c; }

  .food-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .food-chip { background: #fff; border-radius: 10px; padding: 7px 12px; font-size: 0.82rem; font-weight: 500; display: flex; align-items: flex-start; gap: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); flex: 1 1 auto; min-width: 140px; }
  .food-chip .fc-icon { flex-shrink: 0; }
  .food-chip .fc-label { display: block; font-size: 0.63rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 1px; }

  .yummy-strip { background: linear-gradient(135deg,#fff3cd,#ffe8a1); border: 1.5px solid #f5c842; border-radius: 12px; padding: 8px 12px; margin-top: 10px; font-size: 0.82rem; font-weight: 600; color: #8a6200; display: flex; align-items: center; gap: 6px; }

  .empty-note { font-size: 0.8rem; color: var(--muted); font-style: italic; padding: 4px 2px; }

  .day-end { text-align: center; padding: 10px 0 4px; color: var(--muted); font-size: 0.82rem; font-family: 'Fraunces', serif; font-style: italic; }

  .holiday-card { background: var(--card-bg); border-radius: 20px; padding: 40px 20px; text-align: center; border: 2px dashed var(--line); margin-top: 10px; }
  .holiday-card .h-emoji { font-size: 3rem; display: block; margin-bottom: 10px; }
  .holiday-card h3 { font-family: 'Fraunces', serif; font-size: 1.4rem; color: var(--accent); }
  .holiday-card p { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }

  .footer { text-align: center; padding: 0 16px 32px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>

<div class="header">
  <span class="header-sun">☀️</span>
  <h1>Cafeteria Menu</h1>
  <p>July 2026 • Regular + Jain meals</p>

hnut", "jain": "Plain Doughnut"}}};

const WEEKS = [
  { label: 'Week 1 · Jul 13–17', days: ['2026-07-13','2026-07-14','2026-07-15','2026-07-16','2026-07-17'] },
  { label: 'Week 2 · Jul 20–24', days: ['2026-07-20','2026-07-21','2026-07-22','2026-07-23','2026-07-24'] },
  { label: 'Week 3 · Jul 27–31', days: ['2026-07-27','2026-07-28','2026-07-29','2026-07-30','2026-07-31'] },
];

const DAY_NAMES = {
  '13':'Mon','14':'Tue','15':'Wed','16':'Thu','17':'Fri',
  '20':'Mon','21':'Tue','22':'Wed','23':'Thu','24':'Fri',
  '27':'Mon','28':'Tue','29':'Wed','30':'Thu','31':'Fri',
};

let currentWeek = 0;
let currentDay = null;
let jainMode = false;

function getTodayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function init() {
  const todayStr = getTodayStr();
  let foundWeek = -1;
  WEEKS.forEach((w,i) => { if (w.days.includes(todayStr)) foundWeek = i; });
  if (foundWeek >= 0) {
    currentWeek = foundWeek;
    currentDay = todayStr;
  } else {
    currentWeek = 0;
    currentDay = WEEKS[0].days[0];
  }
  renderWeekTabs();
  renderDaySelector();
  renderContent();
}

function renderWeekTabs() {
  const wrap = document.getElementById('weekTabs');
  wrap.innerHTML = '';
  WEEKS.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (i === currentWeek ? ' active' : '');
    btn.textContent = w.label;
    btn.onclick = () => { currentWeek = i; currentDay = WEEKS[i].days[0]; renderWeekTabs(); renderDaySelector(); renderContent(); };
    wrap.appendChild(btn);
  });
}

function renderDaySelector() {
  const sel = document.getElementById('daySelector');
  const todayStr = getTodayStr();
  sel.innerHTML = '';
  WEEKS[currentWeek].days.forEach(dateStr => {
    const dd = dateStr.slice(8);
    const dayAbbr = DAY_NAMES[dd] || '';
    const isToday = dateStr === todayStr;
    const isActive = dateStr === currentDay;
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (isActive ? ' active' : '') + (isToday ? ' today-btn' : '');
    btn.innerHTML = `<span class="d-name">${dayAbbr}</span><span class="d-num">${parseInt(dd)}</span><span class="d-dot"></span>`;
    btn.onclick = () => { currentDay = dateStr; renderDaySelector(); renderContent(); };
    sel.appendChild(btn);
  });
}

function toggleJain() {
  jainMode = document.getElementById('jainToggle').checked;
  renderContent();
}

function chip(icon, label, value) {
  if (!value) return '';
  return `<div class="food-chip"><span class="fc-icon">${icon}</span><span><span class="fc-label">${label}</span>${value}</span></div>`;
}

function renderContent() {
  const wrap = document.getElementById('contentWrap');
  const day = MENU[currentDay];
  const dd = currentDay.slice(8);
  const dayAbbr = DAY_NAMES[dd];
  const mode = jainMode ? 'jain' : 'regular';

  const dateObj = new Date(currentDay + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  let html = `<div class="date-label">${dateLabel}</div>`;

  if (!day) {
    html += `<div class="holiday-card"><span class="h-emoji">📅</span><h3>No data</h3><p>Menu not available for this date.</p></div>`;
    wrap.innerHTML = html;
    return;
  }

  const bf = day.breakfast[mode];
  const ey = day.eyBrunch[mode];
  const ln = day.lunch[mode];
  const es = day.eveningSnack[mode];

  // Breakfast
  html += `
    <div class="meal-card breakfast">
      <div class="meal-title">☕ Breakfast</div>
      <div class="food-row">
        ${chip('🥞','Option 1',bf.opt1)}
        ${chip('🥙','Option 2',bf.opt2)}
        ${chip('🍉','Fruit',bf.fruit)}
      </div>
    </div>`;

  // EY Brunch
  html += `
    <div class="meal-card eybrunch">
      <div class="meal-title">🍳 EY Brunch</div>
      <div class="food-row">
        ${chip('🥘','Snack 1',ey.snack1)}
        ${chip('🥣','Accompaniments',ey.accompaniments)}
        ${chip('🍇','Snack 2',ey.snack2)}
      </div>
    </div>`;

  // Lunch
  let lunchChips = `
    ${chip('🥗','Salad',ln.salad)}
    ${chip('🥛','Raita/Soup',ln.raita)}
    ${chip('🍛','Home Favorite Veg',ln.main)}
    ${chip('🫘','Dal',ln.dal)}
    ${chip('🍚','Rice',ln.rice)}
    ${chip('🫓','Bread',ln.bread)}
    ${chip('🍮','Dessert',ln.dessert)}`;
  html += `
    <div class="meal-card lunch">
      <div class="meal-title">🍱 Lunch</div>
      <div class="food-row">${lunchChips}</div>
      ${ln.yummy ? `<div class="yummy-strip">⭐ Yummy of the Day: ${ln.yummy}</div>` : ''}
    </div>`;

  // Evening Snack
  html += `
    <div class="meal-card snack">
      <div class="meal-title">🌆 Evening Snack</div>
      <div class="food-row">${chip('🍪','Snack',es)}</div>
    </div>`;

  html += `<div class="day-end">— End of ${dayAbbr}'s menu —</div>`;

  wrap.innerHTML = html;
}

init();
</script>
