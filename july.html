<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>School Day & Dining · July 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root, [data-theme="light"] {
      /* CAPTAIN AMERICA — Light Mode: bold saturated red/white/blue, comic-flat */
      --sky-dawn:   #ffffff;
      --sky-mid:    #eef1ff;
      --sky-noon:   #dfe6ff;
      --accent:     #1b2a68;
      --accent2:    #d0121b;
      --text:       #0d1233;
      --muted:      #43508a;
      --line:       #1b2a68;
      --line-soft:  rgba(27,42,104,0.35);
      --card-bg:    rgba(255,255,255,0.96);
      --card-solid: #ffffff;
      --shadow:     rgba(13,18,51,0.18);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --radius:     16px;
      --star:       #ffffff;
      --stripe-red: #d0121b;
      --stripe-blue:#1b2a68;
      --stripe-white: #ffffff;
      --break-short-bg1: #fff3e0;
      --break-short-bg2: #ffe3cf;
      --break-short-border: #d0121b;
      --break-short-title: #b3121b;
      --break-long-bg1: #e7ecff;
      --break-long-bg2: #d6deff;
      --break-long-border: #1b2a68;
      --break-long-title: #1b2a68;
    }

    [data-theme="dark"] {
      /* CAPTAIN AMERICA — Dark Mode: deep hero-night navy, glowing red/star accents */
      --sky-dawn:   #060915;
      --sky-mid:    #0b1130;
      --sky-noon:   #121a4a;
      --accent:     #4e63ff;
      --accent2:    #ff2d3d;
      --text:       #f4f6ff;
      --muted:      #9aa6e8;
      --line:       #2c3680;
      --line-soft:  rgba(44,54,128,0.6);
      --card-bg:    rgba(11,17,48,0.92);
      --card-solid: #10163f;
      --shadow:     rgba(0,0,0,0.55);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --radius:     16px;
      --star:       #ffffff;
      --stripe-red: #ff2d3d;
      --stripe-blue:#4e63ff;
      --stripe-white: #f4f6ff;
      --break-short-bg1: #2a1420;
      --break-short-bg2: #3a1626;
      --break-short-border: #ff2d3d;
      --break-short-title: #ff8c96;
      --break-long-bg1: #141c46;
      --break-long-bg2: #1c2660;
      --break-long-border: #4e63ff;
      --break-long-title: #9aa6ff;
    }

    /* ============ IRON MAN THEME (Tuesday) ============ */
    [data-hero="ironman"][data-theme="light"] {
      --sky-dawn:   #fff3e0;
      --sky-mid:    #ffd9a8;
      --sky-noon:   #ffb454;
      --accent:     #a6151c;
      --accent2:    #ffb700;
      --text:       #2a0e05;
      --muted:      #7a4a1a;
      --line:       #a6151c;
      --line-soft:  rgba(166,21,28,0.35);
      --card-bg:    rgba(255,250,240,0.94);
      --card-solid: #fffaf0;
      --shadow:     rgba(120,40,0,0.20);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --star:       #26e0ff;
      --stripe-red:   #a6151c;
      --stripe-blue:  #ffb700;
      --stripe-white: #fff4dd;
      --break-short-bg1: #ffe7c2;
      --break-short-bg2: #ffd08a;
      --break-short-border: #a6151c;
      --break-short-title: #8a1015;
      --break-long-bg1: #fff0d6;
      --break-long-bg2: #ffdca0;
      --break-long-border: #ffb700;
      --break-long-title: #9a6b00;
      --reactor-glow: #26e0ff;
    }

    [data-hero="ironman"][data-theme="dark"] {
      --sky-dawn:   #0a0a0d;
      --sky-mid:    #14100c;
      --sky-noon:   #1f1409;
      --accent:     #ff3b3b;
      --accent2:    #ffd042;
      --text:       #fff3dc;
      --muted:      #d9a86b;
      --line:       #4a2a10;
      --line-soft:  rgba(74,42,16,0.7);
      --card-bg:    rgba(20,15,10,0.92);
      --card-solid: #171210;
      --shadow:     rgba(0,0,0,0.6);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --star:       #3ff0ff;
      --stripe-red:   #ff3b3b;
      --stripe-blue:  #ffd042;
      --stripe-white: #2b2b2b;
      --break-short-bg1: #2b1210;
      --break-short-bg2: #3d1712;
      --break-short-border: #ff3b3b;
      --break-short-title: #ff9a8a;
      --break-long-bg1: #2b2008;
      --break-long-bg2: #3d2c0a;
      --break-long-border: #ffd042;
      --break-long-title: #ffe089;
      --reactor-glow: #3ff0ff;
    }

    /* ============ HULK THEME (Wednesday) ============ */
    [data-hero="hulk"][data-theme="light"] {
      --sky-dawn:   #eaffe8;
      --sky-mid:    #c7f4b8;
      --sky-noon:   #8fdc6e;
      --accent:     #2e7d32;
      --accent2:    #4a148c;
      --text:       #12240f;
      --muted:      #3f6b3a;
      --line:       #2e7d32;
      --line-soft:  rgba(46,125,50,0.35);
      --card-bg:    rgba(246,255,240,0.94);
      --card-solid: #f6fff0;
      --shadow:     rgba(18,40,10,0.20);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --star:       #d1ff5e;
      --stripe-red:   #2e7d32;
      --stripe-blue:  #4a148c;
      --stripe-white: #e8ffdc;
      --break-short-bg1: #e3ffd6;
      --break-short-bg2: #c3f0a4;
      --break-short-border: #2e7d32;
      --break-short-title: #1b5e20;
      --break-long-bg1: #f0e4ff;
      --break-long-bg2: #dcc2f5;
      --break-long-border: #4a148c;
      --break-long-title: #4a148c;
      --reactor-glow: #7cff3f;
    }

    [data-hero="hulk"][data-theme="dark"] {
      --sky-dawn:   #060d05;
      --sky-mid:    #0b1c09;
      --sky-noon:   #10280d;
      --accent:     #4ade52;
      --accent2:    #b34dff;
      --text:       #e9ffe3;
      --muted:      #9fd18f;
      --line:       #1c4a1a;
      --line-soft:  rgba(28,74,26,0.7);
      --card-bg:    rgba(10,20,9,0.92);
      --card-solid: #0f1c0d;
      --shadow:     rgba(0,0,0,0.6);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --star:       #c6ff5e;
      --stripe-red:   #4ade52;
      --stripe-blue:  #b34dff;
      --stripe-white: #16330f;
      --break-short-bg1: #12300f;
      --break-short-bg2: #1a4016;
      --break-short-border: #4ade52;
      --break-short-title: #9dffa0;
      --break-long-bg1: #250f38;
      --break-long-bg2: #331550;
      --break-long-border: #b34dff;
      --break-long-title: #dcb3ff;
      --reactor-glow: #8dff4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-grad);
      min-height: 100vh;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(70px); opacity: 0.5;
    }
    body::before { width: 360px; height: 360px; top: -100px; right: -100px; background: var(--accent2); }
    body::after { width: 320px; height: 320px; bottom: -80px; left: -80px; background: var(--accent); }
    [data-theme="dark"] body::before, [data-theme="dark"] body::after { opacity: 0.4; }
    .header, .cap-stripe-banner, .month-tabs, .week-tabs, .day-selector, .timeline-wrap, .footer { position: relative; z-index: 1; }
    div[style*="padding: 0 20px"] { position: relative; z-index: 1; }

    /* HEADER */
    .header { padding: 20px 20px 16px; text-align: center; position: relative; }
    .header-actions { display: flex; justify-content: flex-end; margin-bottom: 6px; }
    .theme-toggle { width: 42px; height: 42px; border-radius: 999px; border: 2px solid var(--accent2); background: var(--card-bg); color: var(--text); display: inline-flex; align-items: center; justify-content: center; font-size: 1.05rem; box-shadow: 0 4px 14px var(--shadow); cursor: pointer; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; }
    .theme-toggle:hover { transform: translateY(-1px); }
    .theme-toggle:active { transform: translateY(0); }
    .cap-shield-wrap { position: relative; width: 88px; height: 88px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
    .cap-shield-wrap::before {
      content: ''; position: absolute; inset: -10px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
      opacity: 0.45; filter: blur(10px);
      animation: emblem-glow-pulse 2.6s ease-in-out infinite;
    }
    .cap-shield {
      position: relative; width: 78px; height: 78px; border-radius: 50%;
      background: repeating-radial-gradient(
        circle,
        var(--stripe-red) 0 10px,
        var(--stripe-white) 10px 20px,
        var(--stripe-blue) 20px 30px,
        var(--stripe-white) 30px 37px,
        var(--stripe-red) 37px 39px
      );
      box-shadow: 0 6px 20px var(--shadow), inset 0 0 0 3px var(--stripe-white), 0 0 24px 2px var(--accent2);
      display: flex; align-items: center; justify-content: center;
      animation: shield-spin 16s linear infinite;
    }
    .cap-star { color: var(--stripe-white); font-size: 1.6rem; text-shadow: 0 0 6px rgba(0,0,0,0.4); }
    @keyframes shield-spin { to { transform: rotate(360deg); } }
    @keyframes emblem-glow-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.96); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }

    /* Star-spangled stripe banner under the header */
    .cap-stripe-banner {
      height: 8px; width: 100%;
      background: repeating-linear-gradient(
        90deg,
        var(--stripe-red) 0 24px,
        var(--stripe-white) 24px 48px,
        var(--stripe-blue) 48px 72px
      );
    }

    /* ============ IRON MAN ARC REACTOR EMBLEM (Tuesday) ============ */
    [data-hero="ironman"] .cap-shield {
      background: radial-gradient(circle, var(--reactor-glow) 0 14px, var(--stripe-blue) 14px 28px, var(--stripe-red) 28px 39px);
      box-shadow: 0 0 24px 6px var(--reactor-glow), 0 6px 20px var(--shadow), inset 0 0 0 3px var(--stripe-white);
      animation: reactor-pulse 2.2s ease-in-out infinite, shield-spin 26s linear infinite;
    }
    [data-hero="ironman"] .cap-star { color: var(--reactor-glow); text-shadow: 0 0 10px var(--reactor-glow); font-size: 1.3rem; }
    [data-hero="ironman"] .cap-shield-wrap::before { background: radial-gradient(circle, var(--reactor-glow) 0%, transparent 70%); }
    @keyframes reactor-pulse {
      0%, 100% { box-shadow: 0 0 18px 4px var(--reactor-glow), 0 6px 20px var(--shadow), inset 0 0 0 3px var(--stripe-white); }
      50% { box-shadow: 0 0 34px 10px var(--reactor-glow), 0 6px 20px var(--shadow), inset 0 0 0 3px var(--stripe-white); }
    }
    [data-hero="ironman"] .cap-stripe-banner {
      background: repeating-linear-gradient(
        90deg,
        var(--stripe-red) 0 22px,
        var(--stripe-blue) 22px 44px
      );
    }
    [data-hero="ironman"] .header h1 {
      text-shadow: 1px 1px 0 var(--stripe-blue), 0 0 10px var(--reactor-glow);
    }

    /* ============ HULK SMASH EMBLEM (Wednesday) ============ */
    /* Comic halftone dot texture across the whole page */
    [data-hero="hulk"] body::before, [data-hero="hulk"] body::after { display: none; }
    [data-hero="hulk"] body {
      background-image:
        radial-gradient(circle, var(--line-soft) 1.6px, transparent 1.6px),
        var(--bg-grad);
      background-size: 18px 18px, 100% 100%;
      background-position: 0 0, 0 0;
    }

    /* Fist-through-wall emblem: green fist bursting through jagged comic rip */
    [data-hero="hulk"] .cap-shield-wrap { width: 100px; height: 92px; }
    [data-hero="hulk"] .cap-shield-wrap::before {
      background: radial-gradient(circle, var(--reactor-glow) 0%, transparent 65%);
      animation: emblem-glow-pulse 1.3s ease-in-out infinite;
    }
    [data-hero="hulk"] .cap-shield {
      width: 84px; height: 84px;
      background: var(--reactor-glow);
      border-radius: 0;
      clip-path: polygon(50% 2%, 63% 18%, 82% 8%, 78% 28%, 98% 32%, 84% 46%, 100% 62%, 78% 64%, 84% 86%, 62% 76%, 50% 98%, 38% 76%, 16% 86%, 22% 64%, 0% 62%, 16% 46%, 2% 32%, 22% 28%, 18% 8%, 37% 18%);
      box-shadow: 0 0 26px 6px var(--reactor-glow), inset 0 0 0 4px var(--accent2);
      display: flex; align-items: center; justify-content: center;
      animation: hulk-smash 1.4s cubic-bezier(0.36,0.07,0.19,0.97) infinite;
    }
    [data-hero="hulk"] .cap-star {
      content: '';
      font-size: 0; width: 0; height: 0; /* hide star glyph */
    }
    [data-hero="hulk"] .cap-shield::after {
      content: '✊'; font-size: 2.1rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    }
    [data-hero="hulk"] .cap-shield::before {
      content: 'SMASH!';
      position: absolute; top: -14px; right: -34px;
      font-family: 'Fraunces', serif; font-weight: 900; font-size: 0.62rem; letter-spacing: 0.03em;
      color: var(--stripe-white); background: var(--accent2);
      padding: 3px 7px; border-radius: 4px; transform: rotate(-10deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      opacity: 0; animation: smash-pop 3.5s ease-in-out infinite;
    }
    @keyframes hulk-smash {
      0%, 55%, 100% { transform: scale(1) rotate(0deg); }
      60% { transform: scale(1.22) rotate(-6deg); }
      68% { transform: scale(0.9) rotate(4deg); }
      75% { transform: scale(1.08) rotate(-2deg); }
      82% { transform: scale(1) rotate(0deg); }
    }
    @keyframes smash-pop {
      0%, 52%, 100% { opacity: 0; transform: rotate(-10deg) scale(0.6); }
      58% { opacity: 1; transform: rotate(-10deg) scale(1.15); }
      66% { opacity: 1; transform: rotate(-10deg) scale(1); }
      80% { opacity: 0; transform: rotate(-10deg) scale(0.9); }
    }

    /* Cracked-ground jagged stripe instead of a smooth banner */
    [data-hero="hulk"] .cap-stripe-banner {
      height: 10px;
      background: var(--accent);
      clip-path: polygon(0% 100%, 3% 20%, 8% 100%, 13% 10%, 19% 100%, 25% 30%, 31% 100%, 37% 0%, 43% 100%, 49% 25%, 55% 100%, 61% 15%, 67% 100%, 73% 35%, 79% 100%, 85% 5%, 91% 100%, 96% 22%, 100% 100%);
      animation: hulk-shake 3.2s ease-in-out infinite;
    }
    @keyframes hulk-shake {
      0%, 88%, 100% { transform: translateX(0) translateY(0); }
      90% { transform: translateX(-3px) translateY(1px); }
      92% { transform: translateX(3px) translateY(-1px); }
      94% { transform: translateX(-2px) translateY(1px); }
      96% { transform: translateX(2px) translateY(0); }
    }

    [data-hero="hulk"] .header h1 {
      text-shadow: 2px 2px 0 var(--accent2), 0 0 14px var(--reactor-glow);
    }
    [data-hero="hulk"] .period-card {
      animation: hulk-card-tremor 6s ease-in-out infinite;
    }
    @keyframes hulk-card-tremor {
      0%, 96%, 100% { transform: translateX(0); }
      97% { transform: translateX(-1px); }
      98% { transform: translateX(1px); }
      99% { transform: translateX(-1px); }
    }
    [data-hero="hulk"] .period-card:hover {
      transform: translateY(-2px) scale(1.01);
    }


        /* ============ SPIDER-MAN THEME (Friday) ============ */
    [data-hero="spiderman"][data-theme="light"] {
      --sky-dawn:   #fef6f7;
      --sky-mid:    #ffd1d7;
      --sky-noon:   #f2a0aa;
      --accent:     #e50914;
      --accent2:    #0a1a3c;
      --text:       #17070a;
      --muted:      #7a3540;
      --line:       #c0c0c0;
      --line-soft:  rgba(192,192,192,0.36);
      --card-bg:    rgba(255,250,251,0.95);
      --card-solid: #fff7f8;
      --shadow:     rgba(90,10,20,0.18);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --star:       #ffffff;
      --stripe-red:   #e50914;
      --stripe-blue:  #1e90ff;
      --stripe-white: #c0c0c0;
      --break-short-bg1: #ffe1e5;
      --break-short-bg2: #ffc2ca;
      --break-short-border: #e50914;
      --break-short-title: #b31217;
      --break-long-bg1: #ddeaff;
      --break-long-bg2: #b9d5ff;
      --break-long-border: #1e90ff;
      --break-long-title: #0a3d8f;
      --web-glow: #ff5b69;
      --web-line: rgba(0,0,0,0.14);
    }

    [data-hero="spiderman"][data-theme="dark"] {
      --sky-dawn:   #000000;
      --sky-mid:    #07090f;
      --sky-noon:   #101522;
      --accent:     #ff1a1a;
      --accent2:    #1e90ff;
      --text:       #fff4f5;
      --muted:      #ffb1b6;
      --line:       #4a4a4a;
      --line-soft:  rgba(255,255,255,0.12);
      --card-bg:    rgba(12,12,16,0.94);
      --card-solid: #111317;
      --shadow:     rgba(0,0,0,0.72);
      --bg-grad:    linear-gradient(160deg, var(--sky-dawn) 0%, var(--sky-mid) 55%, var(--sky-noon) 100%);
      --star:       #ffffff;
      --stripe-red:   #ff1a1a;
      --stripe-blue:  #1e90ff;
      --stripe-white: #b7bcc8;
      --break-short-bg1: #24070b;
      --break-short-bg2: #360b10;
      --break-short-border: #ff1a1a;
      --break-short-title: #ff8e99;
      --break-long-bg1: #071225;
      --break-long-bg2: #0e1d3d;
      --break-long-border: #1e90ff;
      --break-long-title: #9dc3ff;
      --web-glow: #ff5b69;
      --web-line: rgba(255,255,255,0.10);
    }

    [data-hero="spiderman"] body {
      background-image:
        radial-gradient(circle at 20px 20px, var(--web-line) 1.1px, transparent 1.1px),
        radial-gradient(circle at 0 0, transparent 7px, rgba(255,255,255,0.05) 7px, rgba(255,255,255,0.05) 8px, transparent 8px),
        var(--bg-grad);
      background-size: 20px 20px, 20px 20px, 100% 100%;
    }
    [data-hero="spiderman"] body::before,
    [data-hero="spiderman"] body::after {
      display: block; opacity: 0.28; filter: blur(42px);
    }
    [data-hero="spiderman"] body::before { background: var(--accent2); }
    [data-hero="spiderman"] body::after { background: var(--accent); }
    [data-hero="spiderman"] body > .corner-web {
      position: fixed; width: 180px; height: 180px; pointer-events: none; z-index: 0;
      opacity: 0.55; mix-blend-mode: screen;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-image:
        radial-gradient(circle at 100% 0%, transparent 60px, var(--web-line) 60px 61px, transparent 61px),
        radial-gradient(circle at 100% 0%, transparent 82px, var(--web-line) 82px 83px, transparent 83px),
        radial-gradient(circle at 100% 0%, transparent 104px, var(--web-line) 104px 105px, transparent 105px),
        radial-gradient(circle at 100% 0%, transparent 126px, var(--web-line) 126px 127px, transparent 127px),
        linear-gradient(135deg, transparent 0 48%, var(--web-line) 48% 49%, transparent 49% 51%, var(--web-line) 51% 52%, transparent 52%),
        linear-gradient(45deg, transparent 0 48%, var(--web-line) 48% 49%, transparent 49% 51%, var(--web-line) 51% 52%, transparent 52%);
      animation: corner-web-breathe 4s ease-in-out infinite;
    }
    [data-hero="spiderman"] body > .corner-web.tl { top: 0; left: 0; transform: rotate(0deg); }
    [data-hero="spiderman"] body > .corner-web.tr { top: 0; right: 0; transform: scaleX(-1); }
    [data-hero="spiderman"] body > .corner-web.bl { bottom: 0; left: 0; transform: scaleY(-1); }
    [data-hero="spiderman"] body > .corner-web.br { bottom: 0; right: 0; transform: scale(-1); }
    @keyframes corner-web-breathe {
      0%, 100% { opacity: 0.42; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.68; transform: scale(1.03) rotate(0deg); }
    }

    [data-hero="spiderman"] .cap-shield-wrap {
      width: 112px; height: 100px;
      position: relative;
      perspective: 800px;
    }
    [data-hero="spiderman"] .cap-shield-wrap::before {
      background:
        radial-gradient(circle, var(--web-glow) 0%, transparent 68%),
        radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 62%);

const MONTHS = [
  {
    key: '2026-07',
    label: 'July',
    weeks: [
      { label: 'Week 1 · Jul 13–17', days: ['2026-07-13','2026-07-14','2026-07-15','2026-07-16','2026-07-17'] },
      { label: 'Week 2 · Jul 20–24', days: ['2026-07-20','2026-07-21','2026-07-22','2026-07-23','2026-07-24'] },
      { label: 'Week 3 · Jul 27–31', days: ['2026-07-27','2026-07-28','2026-07-29','2026-07-30','2026-07-31'] },
    ]
  },
];

const DAY_NAMES = {
  '2026-07-13':'Mon','2026-07-14':'Tue','2026-07-15':'Wed','2026-07-16':'Thu','2026-07-17':'Fri',
  '2026-07-20':'Mon','2026-07-21':'Tue','2026-07-22':'Wed','2026-07-23':'Thu','2026-07-24':'Fri',
  '2026-07-27':'Mon','2026-07-28':'Tue','2026-07-29':'Wed','2026-07-30':'Thu','2026-07-31':'Fri',
};
const WEEKDAY_BY_DATE = DAY_NAMES;
const TT_KEY = { 'Mon':'mon','Tue':'tue','Wed':'wed','Thu':'thu','Fri':'fri' };

let currentMonth = 0;
let currentWeek = 0;
let currentDay = null;
let jainMode = false;

function getWeeksForCurrentMonth() {
  return MONTHS[currentMonth].weeks;
}

function findTodayPosition(todayStr) {
  for (let m = 0; m < MONTHS.length; m++) {
    for (let w = 0; w < MONTHS[m].weeks.length; w++) {
      if (MONTHS[m].weeks[w].days.includes(todayStr)) return { month: m, week: w, day: todayStr };
    }
  }
  return null;
}

// ── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  const todayStr = getTodayStr();
  const found = findTodayPosition(todayStr);
  if (found) {
    currentMonth = found.month;
    currentWeek = found.week;
    currentDay = found.day;
  } else {
    currentMonth = 0;
    currentWeek = 0;
    currentDay = MONTHS[0].weeks[0].days[0];
  }
  renderMonthTabs();
  renderWeekTabs();
  renderDaySelector();
  renderTimeline();
}

function getTodayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function renderMonthTabs() {
  const wrap = document.getElementById('monthTabs');
  wrap.innerHTML = '';
  MONTHS.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'month-chip' + (i === currentMonth ? ' active' : '');
    btn.textContent = m.label;
    btn.onclick = () => {
      currentMonth = i;
      currentWeek = 0;
      currentDay = MONTHS[i].weeks[0].days[0];
      renderMonthTabs();
      renderWeekTabs();
      renderDaySelector();
      renderTimeline();
    };
    wrap.appendChild(btn);
  });
}

function renderWeekTabs() {
  const wrap = document.getElementById('weekTabs');
  const weeks = getWeeksForCurrentMonth();
  wrap.innerHTML = '';
  weeks.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (i === currentWeek ? ' active' : '');
    btn.textContent = w.label;
    btn.onclick = () => {
      currentWeek = i;
      currentDay = weeks[i].days[0];
      renderWeekTabs();
      renderDaySelector();
      renderTimeline();
    };
    wrap.appendChild(btn);
  });
}

function renderDaySelector() {
  const sel = document.getElementById('daySelector');
  const todayStr = getTodayStr();
  const weeks = getWeeksForCurrentMonth();
  sel.innerHTML = '';
  weeks[currentWeek].days.forEach(dateStr => {
    const dd = dateStr.slice(8);
    const dayAbbr = WEEKDAY_BY_DATE[dateStr] || DAY_NAMES[dateStr] || '';
    const isToday = dateStr === todayStr;
    const isActive = dateStr === currentDay;
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (isActive ? ' active' : '') + (isToday ? ' today-btn' : '');
    btn.innerHTML = `<span class="d-name">${dayAbbr}</span><span class="d-num">${parseInt(dd)}</span><span class="d-dot"></span>`;
    btn.onclick = () => { currentDay = dateStr; renderDaySelector(); renderTimeline(); };
    sel.appendChild(btn);
  });
}

function toggleJain() {
  jainMode = document.getElementById('jainToggle').checked;
  renderTimeline();
}

// ── RENDER TIMELINE ───────────────────────────────────────────────────────────
function applyHeroTheme() {
  const dayAbbr = WEEKDAY_BY_DATE[currentDay] || '';
  const HERO_BY_DAY = { 'Tue': 'ironman', 'Wed': 'hulk', 'Fri': 'spiderman' };
  const hero = HERO_BY_DAY[dayAbbr];
  if (hero) {
    document.documentElement.setAttribute('data-hero', hero);
  } else {
    document.documentElement.removeAttribute('data-hero');
  }
}

          <div class="t-dot"></div>
          <div class="period-card">
            <span class="period-icon">${meta.icon}</span>
            <div class="period-info">
              <div class="period-name">${subject}</div>
              <div class="period-time">${start} – ${end}</div>
            </div>
            <span class="period-badge">${meta.badge}</span>
          </div>
        </div>`;
    }
  });

  // End of day marker
  html += `
    <div class="t-item" style="position:relative;">
      <div class="t-time">15:00</div>
      <div class="t-dot" style="background:var(--accent2);box-shadow:0 0 0 2px var(--accent2);width:18px;height:18px;left:26px;top:10px;"></div>
      <div class="period-card" style="border-left-color:var(--accent2);background:linear-gradient(135deg,#fff5f5,#ffe8e8);">
        <span class="period-icon">🏠</span>
        <div class="period-info">
          <div class="period-name">School Ends (HRT)</div>
          <div class="period-time">See you next school day!</div>
        </div>
      </div>
    </div>`;

  html += `</div>`;
  html += `<div class="day-end">— End of ${scheduleName}'s schedule —</div>`;

  wrap.innerHTML = html;
}

init();
</script>

<script>
(function(){
  const root = document.documentElement;
  const toggle = document.querySelector('[data-theme-toggle]');
  let currentTheme = root.getAttribute('data-theme') || 'light';
  function syncToggle(){
    if(!toggle) return;
    toggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
    toggle.setAttribute('aria-label', currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    toggle.setAttribute('title', currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }
  root.setAttribute('data-theme', currentTheme);
  syncToggle();
  toggle && toggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', currentTheme);
    syncToggle();
  });
})();
</script>

</body>
</html>
