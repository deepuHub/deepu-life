<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 252' width='620' height='252' font-family='Verdana,Arial,sans-serif'><rect width='620' height='252' fill='#ffffff'/><rect x='8' y='8' width='604' height='236' rx='14' fill='#fff6ec' stroke='#c05621' stroke-width='3'/><text x='310.0' y='46' font-size='21' font-weight='bold' fill='#c05621' text-anchor='middle'>📝 A message on the fridge</text><text x='32' y='82' font-size='16.5' fill='#222'>Hi Aarav,</text><text x='32' y='109' font-size='16.5' fill='#222'>Mum here. I will be late today. Please take the key</text><text x='32' y='136' font-size='16.5' fill='#222'>from Mrs. Rao next door. Your snack is in the blue box</text><text x='32' y='163' font-size='16.5' fill='#222'>on the table. Finish your homework before you watch TV.</text><text x='32' y='190' font-size='16.5' fill='#222'>I will be home by 7.</text><text x='32' y='217' font-size='16.5' fill='#222'>Love, Mum</text></svg>