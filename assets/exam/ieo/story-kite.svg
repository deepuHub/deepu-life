<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 252' width='600' height='252' font-family='Verdana,Arial,sans-serif'><rect width='600' height='252' fill='#ffffff'/><rect x='8' y='8' width='584' height='236' rx='14' fill='#eef5fc' stroke='#2b6cb0' stroke-width='3'/><text x='300.0' y='46' font-size='21' font-weight='bold' fill='#2b6cb0' text-anchor='middle'>Read the story: Tom's Kite</text><text x='32' y='82' font-size='16.5' fill='#222'>Tom had a big red kite. On Sunday, he went to the</text><text x='32' y='109' font-size='16.5' fill='#222'>park with his sister Mia. The wind was strong, so</text><text x='32' y='136' font-size='16.5' fill='#222'>the kite flew very high. Suddenly, the string broke!</text><text x='32' y='163' font-size='16.5' fill='#222'>The kite got stuck in a tall mango tree.</text><text x='32' y='190' font-size='16.5' fill='#222'>A kind gardener brought a ladder and got the kite</text><text x='32' y='217' font-size='16.5' fill='#222'>down. Tom said, “Thank you!” and gave him a smile.</text></svg>