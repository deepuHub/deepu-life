<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 333' width='640' height='333' font-family='Verdana,Arial,sans-serif'><rect width='640' height='333' fill='#ffffff'/><rect x='8' y='8' width='624' height='317' rx='14' fill='#f7fafc' stroke='#4a5568' stroke-width='3'/><text x='320.0' y='46' font-size='21' font-weight='bold' fill='#4a5568' text-anchor='middle'>✉️  Subject: birthday party</text><text x='32' y='84' font-size='15.5' fill='#222' text-anchor='start'>From: Sonia    To: Mbeke</text><text x='32' y='111' font-size='15.5' fill='#222' text-anchor='start'></text><text x='32' y='138' font-size='15.5' fill='#222' text-anchor='start'>I saw Lisha today. She said that she was going to invite</text><text x='32' y='165' font-size='15.5' fill='#222' text-anchor='start'>Mbeke to her birthday party on 18th November.</text><text x='32' y='192' font-size='15.5' fill='#222' text-anchor='start'>Lisha said that her party will be at the New Club on</text><text x='32' y='219' font-size='15.5' fill='#222' text-anchor='start'>Ikwere Road. It sounds like it will be a great party</text><text x='32' y='246' font-size='15.5' fill='#222' text-anchor='start'>because everyone has to go dressed as an animal!</text><text x='32' y='273' font-size='15.5' fill='#222' text-anchor='start'>Lisha wants everyone to have some of her birthday cake.</text><text x='32' y='300' font-size='15.5' fill='#222' text-anchor='start'>So she's having the party from 3 pm until 5 pm.</text></svg>