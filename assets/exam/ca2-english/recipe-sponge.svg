<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 333' width='620' height='333' font-family='Verdana,Arial,sans-serif'><rect width='620' height='333' fill='#ffffff'/><rect x='8' y='8' width='604' height='317' rx='14' fill='#eef5fc' stroke='#2b6cb0' stroke-width='3'/><text x='310.0' y='46' font-size='21' font-weight='bold' fill='#2b6cb0' text-anchor='middle'>How to make a sponge cake</text><text x='32' y='84' font-size='16.5' fill='#222' text-anchor='start' font-weight='bold'>You will need:</text><text x='32' y='111' font-size='16.5' fill='#222' text-anchor='start'>•  175 g butter, sugar and flour</text><text x='32' y='138' font-size='16.5' fill='#222' text-anchor='start'>•  3 eggs      •  1 tsp baking powder</text><text x='32' y='165' font-size='16.5' fill='#222' text-anchor='start' font-weight='bold'>What to do:</text><text x='32' y='192' font-size='16.5' fill='#222' text-anchor='start'>1  First, mix together the butter and the sugar.</text><text x='32' y='219' font-size='16.5' fill='#222' text-anchor='start'>2  Add the eggs and beat until smooth.</text><text x='32' y='246' font-size='16.5' fill='#222' text-anchor='start'>3  Next, sift in the flour and gently mix.</text><text x='32' y='273' font-size='16.5' fill='#222' text-anchor='start'>4  Finally, bake in the oven for 25 minutes.</text><text x='32' y='300' font-size='16.5' fill='#222' text-anchor='start'>5  When the cake is cool, decorate it with icing.</text></svg>