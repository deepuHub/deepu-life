<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 208' width='640' height='208' font-family='Helvetica,Arial,sans-serif'><rect width='640' height='208' fill='#ffffff'/><rect x='8' y='8' width='624' height='192' rx='14' fill='#effaf3' stroke='#2f855a' stroke-width='3'/><text x='30' y='46' font-size='20' font-weight='bold' fill='#2f855a'>Walking up a staircase</text><text x='600' y='60' font-size='44' text-anchor='end'>🪜</text><text x='30' y='84' font-size='17' fill='#222'><tspan font-weight='bold'>Step 1:</tspan> Lift left foot and place it on the stair.</text><text x='30' y='114' font-size='17' fill='#222'><tspan font-weight='bold'>Step 2:</tspan> Step up using the left foot, place right foot on next stair.</text><text x='30' y='144' font-size='17' fill='#222'><tspan font-weight='bold'>Step 3:</tspan> Step up using the right foot, place left foot on next stair.</text><text x='30' y='174' font-size='17' fill='#222'><tspan font-weight='bold'>Step 4:</tspan> Repeat steps ☐ to ☐ until you reach the top.</text></svg>