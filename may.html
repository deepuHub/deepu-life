    :root {

      --sky-mid:    #fce8c3;
      --sky-noon:   #f9dba0;
      --accent:     #e07b2a;
      --accent2:    #c0392b;
      --text:       #2c1a0e;
      --muted:      #8b6f5c;
      --line:       #e8c99a;
      --card-bg:    rgba(255,255,255,0.88);
      --radius:     16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(175deg, var(--sky-dawn) 0%, var(--sky-mid) 40%, var(--sky-noon) 100%);
      min-height: 100vh;
      color: var(--text);
    }

    /* HEADER */
    .header { padding: 28px 20px 16px; text-align: center; }
    .header-sun { font-size: 2.4rem; display: block; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .header h1 { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; line-height: 1.1; margin-top: 6px; }
    .header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    /* DAY SELECTOR */
    .day-selector { display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px 4px; scrollbar-width: none; }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; background: var(--card-bg); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px 8px; cursor: pointer; transition: all 0.2s ease; min-width: 58px; }
    .day-btn .d-name { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .day-btn .d-num { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 800; color: var(--text); line-height: 1; margin: 2px 0; }
    .day-btn .d-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
    .day-btn.active { background: var(--accent); border-color: var(--accent); }
    .day-btn.active .d-name, .day-btn.active .d-num { color: #fff; }
    .day-btn.active .d-dot { background: rgba(255,255,255,0.7); }
    .day-btn.today-btn { border-color: var(--accent); }
    .day-btn.today-btn .d-dot { background: var(--accent); }

    /* WEEK TABS */
    .week-tabs { display: flex; gap: 6px; padding: 10px 20px 0; overflow-x: auto; scrollbar-width: none; }
    .week-tabs::-webkit-scrollbar { display: none; }
    .week-tab { flex: 0 0 auto; font-size: 0.75rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card-bg); color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .week-tab.active { background: var(--text); border-color: var(--text); color: #fff; }

    /* JAIN TOGGLE */
    .jain-toggle-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 0 12px; }
    .jain-label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
    .toggle { position: relative; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 999px; cursor: pointer; transition: 0.3s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
    .toggle input:checked + .toggle-slider { background: #4caf50; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* TIMELINE */
    .timeline-wrap { padding: 16px 16px 40px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .timeline { position: relative; padding-left: 62px; }
    .timeline::before { content: ''; position: absolute; left: 34px; top: 0; bottom: 0; width: 3px; background: linear-gradient(to bottom, var(--accent), var(--sky-noon)); border-radius: 2px; }
    .t-time { position: absolute; left: 0; width: 58px; text-align: right; padding-right: 14px; font-size: 0.7rem; font-weight: 600; color: var(--muted); line-height: 1; top: 14px; }
    .t-dot { position: absolute; left: 28px; top: 12px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--accent); background: var(--accent); z-index: 1; }
    .t-item { position: relative; margin-bottom: 10px; }

    /* PERIOD CARD */
    .period-card { background: var(--card-bg); border-radius: var(--radius); padding: 11px 14px; border-left: 4px solid var(--accent); box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 10px; }
    .period-icon { font-size: 1.3rem; flex: 0 0 auto; }
    .period-info { flex: 1; min-width: 0; }
    .period-name { font-weight: 600; font-size: 0.95rem; color: var(--text); }
    .period-time { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
    .period-badge { font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; flex: 0 0 auto; }

    /* BREAK CARDS */
    .break-card { border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
    .break-card.short-break { background: linear-gradient(135deg, #fff8f0, #fff3e0); border: 1.5px dashed #f5c07a; }
    .break-card.long-break { background: linear-gradient(135deg, #f0fff4, #e8f5e9); border: 1.5px dashed #81c784; }
    .break-title { font-family: 'Fraunces', serif; font-size: 1rem; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .short-break .break-title { color: #e07b2a; }
    .long-break .break-title { color: #2e7d32; }
    .food-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .food-chip { background: #fff; border-radius: 10px; padding: 5px 10px; font-size: 0.78rem; font-weight: 500; display: flex; align-items: center; gap: 5px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .food-chip .fc-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 1px; }
    .food-chip-inner { display: flex; flex-direction: column; }
    .yummy-strip { background: linear-gradient(135deg,#fff3cd,#ffe8a1); border: 1.5px solid #f5c842; border-radius: 12px; padding: 8px 12px; margin-top: 8px; font-size: 0.82rem; font-weight: 600; color: #8a6200; display: flex; align-items: center; gap: 6px; }
    .snack-strip { background: linear-gradient(135deg,#fce4ec,#f8bbd0); border: 1.5px solid #f48fb1; border-radius: 12px; padding: 8px 12px; margin-top: 6px; font-size: 0.82rem; font-weight: 600; color: #880e4f; display: flex; align-items: center; gap: 6px; }

    /* EXAM CARD */
    .exam-card { background: linear-gradient(135deg,#e8eaf6,#c5cae9); border: 2px solid #7986cb; border-radius: var(--radius); padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .exam-icon { font-size: 1.5rem; }
    .exam-info .exam-subject { font-weight: 700; font-size: 1rem; color: #283593; }
    .exam-info .exam-time { font-size: 0.75rem; color: #5c6bc0; margin-top: 2px; }
    .exam-badge { background: #3f51b5; color: #fff; font-size: 0.65rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; margin-left: auto; }

    /* HOLIDAY / SUMMER */
    .holiday-card { background: var(--card-bg); border-radius: 20px; padding: 40px 20px; text-align: center; border: 2px dashed var(--line); margin-top: 10px; }
    .holiday-card .h-emoji { font-size: 3rem; display: block; margin-bottom: 10px; }
    .holiday-card h3 { font-family: 'Fraunces', serif; font-size: 1.4rem; color: var(--accent); }
    .holiday-card p { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }

    .day-end { text-align: center; padding: 18px 0 4px; color: var(--muted); font-size: 0.82rem; font-family: 'Fraunces', serif; font-style: italic; }
    .footer { text-align: center; padding: 0 16px 32px; color: var(--muted); font-size: 0.78rem; }

    .c-science    { border-color: #16a085; } .c-science    .t-dot, .c-science    .period-badge { background: #16a085; } .c-science    .t-dot { box-shadow: 0 0 0 2px #16a085; }

// ── WEEKS ────────────────────────────────────────────────────────────────────
const WEEKS = [
  { label: 'Week 1 · May 4–8',   days: ['2026-05-04','2026-05-05','2026-05-06','2026-05-07','2026-05-08'] },
  { label: 'Week 2 · May 11–15', days: ['2026-05-11','2026-05-12','2026-05-13','2026-05-14','2026-05-15'] },
  { label: 'Week 3 · May 18–22', days: ['2026-05-18','2026-05-19','2026-05-20','2026-05-21','2026-05-22'] },
];

const DAY_NAMES = {
  '04':'Mon','05':'Tue','06':'Wed','07':'Thu','08':'Fri',
  '11':'Mon','12':'Tue','13':'Wed','14':'Thu','15':'Fri',
  '18':'Mon','19':'Tue','20':'Wed','21':'Thu','22':'Fri',
};
const TT_KEY = { 'Mon':'mon','Tue':'tue','Wed':'wed','Thu':'thu','Fri':'fri' };

let currentWeek = 0;
let currentDay = null;
let jainMode = false;

// ── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  const todayStr = getTodayStr();
  let foundWeek = -1;
  WEEKS.forEach((w,i) => { if (w.days.includes(todayStr)) foundWeek = i; });
  if (foundWeek >= 0) {
    currentWeek = foundWeek;
    currentDay = todayStr;
  } else {
    currentWeek = 0;
    currentDay = WEEKS[0].days[0];
  }
  renderWeekTabs();
  renderDaySelector();
  renderTimeline();
}

function getTodayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function renderWeekTabs() {
  document.querySelectorAll('.week-tab').forEach((t,i) => t.classList.toggle('active', i === currentWeek));
}

function showWeek(idx) {
  currentWeek = idx;
  currentDay = WEEKS[idx].days[0];
  renderWeekTabs();
  renderDaySelector();
  renderTimeline();
}

function renderDaySelector() {
  const sel = document.getElementById('daySelector');
  const todayStr = getTodayStr();
  sel.innerHTML = '';
  WEEKS[currentWeek].days.forEach(dateStr => {
    const dd = dateStr.slice(8);
    const dayAbbr = DAY_NAMES[dd] || '';
    const isToday = dateStr === todayStr;
    const isActive = dateStr === currentDay;
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (isActive ? ' active' : '') + (isToday ? ' today-btn' : '');
    btn.innerHTML = `<span class="d-name">${dayAbbr}</span><span class="d-num">${parseInt(dd)}</span><span class="d-dot"></span>`;
    btn.onclick = () => { currentDay = dateStr; renderDaySelector(); renderTimeline(); };
    sel.appendChild(btn);
  });
}

function toggleJain() {
  jainMode = document.getElementById('jainToggle').checked;
  renderTimeline();
}

// ── RENDER TIMELINE ───────────────────────────────────────────────────────────
function renderTimeline() {
  const wrap = document.getElementById('timelineWrap');
  const menuData = MENU[currentDay];
  const dd = currentDay.slice(8);
  const dayAbbr = DAY_NAMES[dd];
  const mode = jainMode ? 'jain' : 'regular';

  const dateObj = new Date(currentDay + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  let html = `<div style="font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;color:var(--accent);margin-bottom:14px;padding-left:2px;">${dateLabel}</div>`;

  // Summer break
  if (menuData && menuData.summerBreak) {
    html += `<div class="holiday-card"><span class="h-emoji">🌴</span><h3>Summer Break!</h3><p>School resumes in June. Enjoy the holidays!</p></div>`;
    wrap.innerHTML = html;
    return;
  }

  if (!menuData) {
    html += `<div class="holiday-card"><span class="h-emoji">📅</span><h3>No data</h3><p>No menu available for this date.</p></div>`;
    wrap.innerHTML = html;
    return;
  }

  const isExamDay = !!menuData.examDay;
  const examInfo = EXAM_TIMETABLE[currentDay];
  const bf = menuData.breakfast[mode];
  const ln = menuData.lunch ? menuData.lunch[mode] : null;

  html += `<div class="timeline">`;

  if (isExamDay && examInfo) {
    // ── EXAM DAY TIMETABLE ──
    // 8:30 Circle Time / Arrival
    html += periodItem('8:30','9:00','Circle Time');
    // 9:00–10:00 EXAM
    html += `
      <div class="t-item c-exam" style="position:relative;">
        <div class="t-time">9:00</div>
        <div class="t-dot"></div>
        <div class="exam-card">
          <span class="exam-icon">${examInfo.icon}</span>
          <div class="exam-info">
            <div class="exam-subject">✏️ Exam: ${examInfo.subject}</div>
            <div class="exam-time">9:00 AM – 10:00 AM</div>
          </div>
          <span class="exam-badge">Exam</span>
        </div>
      </div>`;
    // SHORT BREAK with breakfast
    html += breakItem('9:45','10:15', bf, 'short');
    // 10:00–12:45 Revision
    html += periodItem('10:00','12:45','Revision');
    // Lunch (no evening snack on half days)
    if (ln) html += lunchItem('12:45','—', ln, true);
    // School ends 12:45
    html += endItem('12:45', 'Half Day — School Ends', 'Exam day — see you tomorrow! 👍');
  } else {
    // ── REGULAR DAY TIMETABLE ──
    const ttKey = TT_KEY[dayAbbr];
    const timetable = TIMETABLE[ttKey] || [];
    timetable.forEach(([start, end, subject]) => {
      if (subject === 'SHORT_BREAK') {
        html += breakItem(start, end, bf, 'short');
      } else if (subject === 'LONG_BREAK') {
        html += lunchItem(start, end, ln, false);
      } else {
        html += periodItem(start, end, subject);
      }
    });
    html += endItem('3:30', 'School Ends', 'See you tomorrow!');
  }

  html += `</div>`;
  html += `<div class="day-end">— End of ${dayAbbr}'s schedule —</div>`;
  wrap.innerHTML = html;
}

function periodItem(start, end, subject) {
  const meta = SUBJECT_META[subject] || { icon:'📌', cat:'c-circle', badge:'Class' };
  return `
    <div class="t-item ${meta.cat}" style="position:relative;">
      <div class="t-time">${start}</div>
      <div class="t-dot"></div>
      <div class="period-card">
        <span class="period-icon">${meta.icon}</span>
        <div class="period-info">
          <div class="period-name">${subject}</div>
          <div class="period-time">${start} – ${end}</div>
        </div>
        <span class="period-badge">${meta.badge}</span>
      </div>
    </div>`;
}

function breakItem(start, end, bf, type) {
  const fruitChip = bf.fruit ? `<div class="food-chip">🍉 <div class="food-chip-inner"><span class="fc-label">Fruit</span>${bf.fruit}</div></div>` : '';
  return `
    <div class="t-item" style="position:relative;">
      <div class="t-time" style="top:16px;">${start}</div>
      <div class="t-dot" style="background:#f39c12;box-shadow:0 0 0 2px #f39c12;"></div>
      <div class="break-card short-break">
        <div class="break-title">☕ Short Break <span style="font-size:0.75rem;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;">${start}–${end}</span></div>
        <div class="food-row">
          <div class="food-chip">🥞 <div class="food-chip-inner"><span class="fc-label">Option 1</span>${bf.opt1}</div></div>
          <div class="food-chip">🥙 <div class="food-chip-inner"><span class="fc-label">Option 2</span>${bf.opt2}</div></div>
          ${fruitChip}
        </div>
      </div>
    </div>`;
}

function lunchItem(start, end, ln, isHalfDay) {
  if (!ln) return '';
  let items = '';
  if (ln.salad)   items += `<div class="food-chip">🥗 <div class="food-chip-inner"><span class="fc-label">Salad</span>${ln.salad}</div></div>`;
  if (ln.raita)   items += `<div class="food-chip">🥛 <div class="food-chip-inner"><span class="fc-label">Raita/Drink</span>${ln.raita}</div></div>`;
  if (ln.main)    items += `<div class="food-chip">🍛 <div class="food-chip-inner"><span class="fc-label">Main Veg</span>${ln.main}</div></div>`;
  if (ln.dal)     items += `<div class="food-chip">🫘 <div class="food-chip-inner"><span class="fc-label">Dal</span>${ln.dal}</div></div>`;
  if (ln.rice)    items += `<div class="food-chip">🍚 <div class="food-chip-inner"><span class="fc-label">Rice</span>${ln.rice}</div></div>`;
  if (ln.bread)   items += `<div class="food-chip">🫓 <div class="food-chip-inner"><span class="fc-label">Bread</span>${ln.bread}</div></div>`;
  if (ln.dessert) items += `<div class="food-chip">🍮 <div class="food-chip-inner"><span class="fc-label">Dessert</span>${ln.dessert}</div></div>`;
  if (ln.acc)     items += `<div class="food-chip">🥤 <div class="food-chip-inner"><span class="fc-label">Accompaniment</span>${ln.acc}</div></div>`;

  const snackHtml = (!isHalfDay && ln.snack) ? `<div class="snack-strip">🌆 Evening Snack: ${ln.snack}</div>` : '';
  const yummyHtml = ln.yummy ? `<div class="yummy-strip">⭐ Yummy of the Day: ${ln.yummy}</div>` : '';
  const title = isHalfDay ? '🍱 Lunch' : '🍱 Lunch Break';
  const timeLabel = end === '—' ? '' : `${start}–${end}`;

  return `
    <div class="t-item" style="position:relative;">
      <div class="t-time" style="top:16px;">${start}</div>
      <div class="t-dot" style="background:#27ae60;box-shadow:0 0 0 2px #27ae60;"></div>
      <div class="break-card long-break">
        <div class="break-title">${title} <span style="font-size:0.75rem;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;">${timeLabel}</span></div>
        <div class="food-row">${items}</div>
        ${yummyHtml}
        ${snackHtml}
      </div>
    </div>`;
}

function endItem(time, label, sub) {
  return `
    <div class="t-item" style="position:relative;">
      <div class="t-time">${time}</div>
      <div class="t-dot" style="background:var(--accent2);box-shadow:0 0 0 2px var(--accent2);width:18px;height:18px;left:26px;top:10px;"></div>
      <div class="period-card" style="border-left-color:var(--accent2);background:linear-gradient(135deg,#fff5f5,#ffe8e8);">
        <span class="period-icon">🏠</span>
        <div class="period-info">
          <div class="period-name">${label}</div>
          <div class="period-time">${sub}</div>
        </div>
      </div>
    </div>`;
}
