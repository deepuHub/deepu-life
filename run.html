<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>try{var t=localStorage.getItem('deepu-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <title>Run — deepu-life</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏃%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tracker-theme.css">
  <link rel="stylesheet" href="assets/css/timeline.css">
  <link rel="stylesheet" href="assets/css/activity.css">
</head>
<body>

<deepu-nav active="run"></deepu-nav>

<main class="page" style="--ac:var(--run);--ac-dim:var(--run-dim)">
  <div class="sec-head">
    <div><p class="sec-eyebrow run-c">Running</p><h1 class="sec-title">Run log.</h1></div>
    <div class="sec-actions">
      <a id="sheets-link" href="#" target="_blank" rel="noopener" class="sheets-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
        Add in Sheets
      </a>
      <div class="sync-badge" id="sync-badge"><span class="sync-dot"></span><span class="sync-label">Loading…</span></div>
    </div>
  </div>
  <div class="summary-strip" id="run-sum"></div>
  <div id="run-tv"></div>
  <div class="list-wrap">
    <div class="list-section-label">All Runs</div>
    <div class="twrap"><table class="etable"><thead><tr><th>Date</th><th>Distance</th><th>Duration</th><th class="ht">Pace</th><th class="ht">Notes</th></tr></thead><tbody id="run-tbody"></tbody></table></div>
    <div class="card-list" id="run-cards"></div>
    <div class="empty-st" id="run-empty"><span class="emo">🏃</span>No runs yet — add one in the <strong>Runs</strong> tab in Google Sheets.</div>
  </div>
</main>

<script src="assets/js/theme.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/timeline.js"></script>
<script src="assets/js/activity.js"></script>
<script>
const pace = r => r.time && r.dist ? (parseFloat(r.time)/parseFloat(r.dist)).toFixed(1)+' min/mi' : null;

const runCfg = {
  color:'#c8f04a', icon:'🏃',
  getDate: r => r.date,
  getBarH: r => parseFloat(r.dist) || 1,
  makeMarkerVal: r => `${r.dist}mi`,
  getTeaserTitle: r => `${r.dist} mi`,
  makeSlide: r => `<div class="tl-slide-inner">
      <div class="tl-date">${fmtF(r.date)}</div>
      <div class="tl-stat run-c">${escHtml(r.dist)}<small> mi</small></div>
      <div class="tl-meta">
        ${r.time  ? `<span class="badge b-neu">${escHtml(r.time)} min</span>` : ''}
        ${pace(r) ? `<span class="badge b-run">⚡ ${pace(r)}</span>` : ''}
      </div>
      ${r.note ? `<div class="tl-note">${escHtml(r.note)}</div>` : ''}
    </div>`,
};

function render(data) {
  setSheetLink(document.getElementById('sheets-link'), 'Runs', data.gids);
  const runs = [...(data.runs || [])].sort((a,b) => String(a.date) < String(b.date) ? -1 : 1);
  document.getElementById('run-empty').style.display = runs.length ? 'none' : 'block';

  document.getElementById('run-tbody').innerHTML = runs.map(r => `<tr>
    <td>${fmtF(r.date)}</td>
    <td><strong class="run-c">${escHtml(r.dist)} mi</strong></td>
    <td>${r.time ? escHtml(r.time)+' min' : '—'}</td>
    <td class="ht" style="color:var(--muted)">${pace(r) || '—'}</td>
    <td class="ht cell-note">${escHtml(r.note || '—')}</td>
  </tr>`).join('');

  document.getElementById('run-cards').innerHTML = runs.map(r => `<div class="ecard">
    <div class="ecard-top"><span class="ecard-title run-c">${escHtml(r.dist)} mi</span></div>
    <div class="ecard-meta"><span class="badge b-run">${fmtS(r.date)}</span>${r.time ? `<span class="badge b-neu">${escHtml(r.time)} min</span>` : ''}</div>
    ${r.note ? `<div class="ecard-note">${escHtml(r.note)}</div>` : ''}
  </div>`).join('');

  tlBuild('run', runs, runCfg);
  tlSetActiveTab('run');

  const total = runs.reduce((s,r) => s + parseFloat(r.dist || 0), 0);
  document.getElementById('run-sum').innerHTML = chips([
    {l:'Total',   v:total.toFixed(1)+' mi', cls:'run-c'},
    {l:'Races',   v:runs.length},
    {l:'Longest', v:runs.length ? Math.max(...runs.map(r => parseFloat(r.dist || 0)))+' mi' : '—', cls:'run-c'},
    {l:'Avg',     v:runs.length ? (total/runs.length).toFixed(1)+' mi' : '—'},
  ]);
}

setSheetLink(document.getElementById('sheets-link'), 'Runs');
loadTracker(render);
</script>
</body>
</html>
