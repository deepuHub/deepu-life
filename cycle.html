<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>try{var t=localStorage.getItem('deepu-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <title>Cycle — deepu-life</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚴%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tracker-theme.css">
  <link rel="stylesheet" href="assets/css/timeline.css">
  <link rel="stylesheet" href="assets/css/activity.css">
  <style>.b-cycle{background:var(--cycle-dim);color:var(--cycle)}</style>
</head>
<body>

<deepu-nav active="cycle"></deepu-nav>

<main class="page" style="--ac:var(--cycle);--ac-dim:var(--cycle-dim)">
  <div class="sec-head">
    <div><p class="sec-eyebrow cycle-c">Cycling</p><h1 class="sec-title">Ride log.</h1></div>
    <div class="sec-actions">
      <a id="sheets-link" href="#" target="_blank" rel="noopener" class="sheets-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
        Add in Sheets
      </a>
      <div class="sync-badge" id="sync-badge"><span class="sync-dot"></span><span class="sync-label">Loading…</span></div>
    </div>
  </div>
  <div class="summary-strip" id="cycle-sum"></div>
  <div id="cycle-tv"></div>
  <div class="list-wrap">
    <div class="list-section-label">All Rides</div>
    <div class="twrap"><table class="etable"><thead><tr><th>Date</th><th>Distance</th><th>Duration</th><th class="ht">Type</th><th class="ht">Zone</th><th>Status</th><th class="ht">Notes</th></tr></thead><tbody id="cycle-tbody"></tbody></table></div>
    <div class="card-list" id="cycle-cards"></div>
    <div class="empty-st" id="cycle-empty"><span class="emo">🚴</span>No rides yet — add one in the <strong>Rides</strong> tab in Google Sheets.</div>
  </div>
</main>

<script src="assets/js/theme.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/timeline.js"></script>
<script src="assets/js/activity.js"></script>
<script>
const statusBadge = r => {
  if (!r.status) return '';
  const s = r.status.toLowerCase();
  return `<span class="badge ${s==='skipped' ? 'b-fail' : s==='done' ? 'b-done' : 'b-neu'}">${escHtml(r.status)}</span>`;
};

const cycleCfg = {
  color:'#a78bfa', icon:'🚴',
  getDate: r => r.date,
  getBarH: r => parseFloat(r.dist) || 1,
  makeMarkerVal: r => `${r.dist}km`,
  getTeaserTitle: r => `${r.dist} km`,
  makeSlide: r => `<div class="tl-slide-inner">
      <div class="tl-date">${fmtF(r.date)}</div>
      <div class="tl-stat cycle-c">${escHtml(r.dist)}<small> km</small></div>
      <div class="tl-meta">
        ${r.duration ? `<span class="badge b-neu">${escHtml(r.duration)}</span>` : ''}
        ${r.type     ? `<span class="badge b-cycle">${escHtml(r.type)}</span>` : ''}
        ${r.zone     ? `<span class="badge b-cycle">${escHtml(r.zone)}</span>` : ''}
        ${statusBadge(r)}
      </div>
      ${r.note ? `<div class="tl-note">${escHtml(r.note)}</div>` : ''}
    </div>`,
};

function render(data) {
  setSheetLink(document.getElementById('sheets-link'), 'Rides', data.gids);
  const rides = [...(data.cycling || [])].sort((a,b) => String(a.date) < String(b.date) ? -1 : 1);
  document.getElementById('cycle-empty').style.display = rides.length ? 'none' : 'block';

  document.getElementById('cycle-tbody').innerHTML = rides.map(r => `<tr>
    <td>${fmtS(r.date)}</td>
    <td><strong class="cycle-c">${escHtml(r.dist)} km</strong></td>
    <td>${escHtml(r.duration || '—')}</td>
    <td class="ht">${escHtml(r.type || '—')}</td>
    <td class="ht">${escHtml(r.zone || '—')}</td>
    <td>${statusBadge(r) || '—'}</td>
    <td class="ht cell-note">${escHtml(r.note || '—')}</td>
  </tr>`).join('');

  document.getElementById('cycle-cards').innerHTML = rides.map(r => `<div class="ecard">
    <div class="ecard-top"><span class="ecard-title cycle-c">${escHtml(r.dist)} km</span></div>
    <div class="ecard-meta"><span class="badge b-cycle">${fmtS(r.date)}</span>${r.duration ? `<span class="badge b-neu">${escHtml(r.duration)}</span>` : ''}${statusBadge(r)}</div>
    ${r.note ? `<div class="ecard-note">${escHtml(r.note)}</div>` : ''}
  </div>`).join('');

  tlBuild('cycle', rides, cycleCfg);
  tlSetActiveTab('cycle');

  const total = rides.reduce((s,r) => s + parseFloat(r.dist || 0), 0);
  document.getElementById('cycle-sum').innerHTML = chips([
    {l:'Total km', v:total.toFixed(0)+' km', cls:'cycle-c'},
    {l:'Rides',    v:rides.length},
    {l:'Longest',  v:rides.length ? Math.max(...rides.map(r => parseFloat(r.dist || 0)))+' km' : '—', cls:'cycle-c'},
    {l:'Avg',      v:rides.length ? (total/rides.length).toFixed(0)+' km' : '—'},
  ]);
}

setSheetLink(document.getElementById('sheets-link'), 'Rides');
loadTracker(render);
</script>
</body>
</html>
