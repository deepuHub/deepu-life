<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>try{var t=localStorage.getItem('deepu-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%226%22%20fill=%22%230a0f0d%22%2F%3E%3Ctext%20x=%2216%22%20y=%2223%22%20font-family=%22Georgia%2Cserif%22%20font-weight=%22900%22%20font-size=%2222%22%20text-anchor=%22middle%22%20fill=%22%23c8f04a%22%3Ed%3C%2Ftext%3E%3Ccircle%20cx=%2226%22%20cy=%2226%22%20r=%223%22%20fill=%22%23c8f04a%22%2F%3E%3C%2Fsvg%3E"/>
  <title>deepu-life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tracker-theme.css">
  <style>
.home{padding:calc(var(--nav-h) + clamp(1.5rem,5vw,3.5rem)) var(--pad) 3rem;max-width:1180px}
.home-title{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2.4rem,7vw,4.6rem);line-height:0.95;letter-spacing:-0.04em}
.home-title em{font-style:italic;font-weight:300;color:var(--muted)}
.home-sub{margin-top:0.9rem;color:var(--muted);font-size:clamp(0.85rem,2vw,0.98rem);max-width:460px;line-height:1.6}

.group{margin-top:clamp(2rem,5vw,3rem)}
.group-label{font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:0.9rem;display:flex;align-items:center;gap:0.75rem}
.group-label::after{content:'';flex:1;height:1px;background:var(--border)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0.7rem}

.card{--ac:var(--muted);position:relative;display:flex;flex-direction:column;gap:0.35rem;min-height:128px;padding:1.05rem 1.1rem;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);text-decoration:none;
  transition:border-color 0.2s,transform 0.2s}
.card:hover{border-color:var(--ac);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card-icon{font-size:1.45rem;line-height:1}
.card-name{font-family:'Fraunces',serif;font-weight:700;font-size:1.08rem;margin-top:0.35rem}
.card-desc{font-size:0.78rem;color:var(--muted);line-height:1.45}
.card-stat{margin-top:auto;padding-top:0.6rem;display:flex;align-items:baseline;gap:0.4rem;flex-wrap:wrap}
.card-stat b{font-family:'Fraunces',serif;font-weight:900;font-size:1.35rem;color:var(--ac);letter-spacing:-0.02em}
.card-stat span{font-size:0.7rem;color:var(--muted)}
.card-lock{position:absolute;top:0.9rem;right:0.95rem;font-size:0.72rem;opacity:0.55}

.saved-note{margin-top:2.2rem;font-size:0.72rem;color:var(--muted)}

.visit-tile{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 2rem;padding:1.15rem 1.3rem;
  background:var(--surface);border:1px solid var(--border);border-radius:10px}
.visit-big{display:flex;align-items:baseline;gap:0.55rem}
.visit-wave{font-size:1.6rem;align-self:center}
.visit-big b{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2rem,5vw,2.6rem);line-height:1;color:var(--grow);letter-spacing:-0.03em}
.visit-big span{font-size:0.8rem;color:var(--muted)}
.visit-flags{display:flex;flex-wrap:wrap;gap:0.4rem;flex:1;min-width:0}
.visit-chip{display:inline-flex;align-items:center;gap:0.35rem;padding:0.3rem 0.7rem;border-radius:999px;border:1px solid var(--border);font-size:0.76rem;white-space:nowrap}
.visit-chip em{font-style:normal;color:var(--muted)}
.visit-status{width:100%;font-size:0.68rem;color:var(--muted)}

@media(max-width:480px){
  .cards{grid-template-columns:repeat(2,1fr);gap:0.5rem}
  .card{min-height:112px;padding:0.9rem}
  .card-desc{display:none}
}
  </style>
</head>
<body>

<deepu-nav active="index"></deepu-nav>

<main class="home">
  <h1 class="home-title">deepu<em>-life.</em></h1>
  <p class="home-sub">Everything in one place — pick where to go.</p>
  <div id="groups"></div>
  <section class="group" aria-label="Visitors">
    <div class="group-label">Visitors</div>
    <div class="visit-tile" id="visitors" aria-live="polite"></div>
  </section>
  <p class="saved-note" id="saved-note"></p>
</main>

<script src="assets/js/theme.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/activity.js"></script>
<script>
/* Static launcher: everything renders straight away. The figures on
   Run / Read / Cycle / Half Marathon come from the copy those pages save
   in this browser's localStorage (assets/js/activity.js), so they appear
   once any of those pages has been opened on this device. The visitor
   tile is the only network work, and it runs after the page is drawn. */
const ACCENT = { run:'var(--run)', read:'var(--read)', cycle:'var(--cycle)', marathon:'var(--plan)' };
const savedData = readTrackerCache;

function statsFor(data) {
  if (!data) return {};
  const dist = rows => rows.reduce((s, r) => s + (parseFloat(r.dist) || 0), 0);
  const done = rows => rows.filter(r => String(r.status || '').toLowerCase() === 'done').length;
  const runs = data.runs || [], books = data.books || [], rides = data.cycling || [], plan = data.plan || [];
  return {
    run:      runs.length  ? [`${dist(runs).toFixed(1)} mi`, `${runs.length} races`] : null,
    read:     books.length ? [done(books), `of ${books.length} books`] : null,
    cycle:    rides.length ? [`${dist(rides).toFixed(0)} km`, `${rides.length} rides`] : null,
    marathon: plan.length  ? [`${done(plan)}/${plan.length}`, 'sessions done'] : null,
  };
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cardHTML(link, stat) {
  const ac = ACCENT[link.key] ? ` style="--ac:${ACCENT[link.key]}"` : '';
  const ext = link.external ? ' target="_blank" rel="noopener"' : '';
  return `<a class="card" href="${link.href}"${ac}${ext}>
    ${link.group === 'private' ? '<span class="card-lock" aria-label="Private">🔒</span>' : ''}
    <span class="card-icon" aria-hidden="true">${link.icon}</span>
    <span class="card-name">${esc(link.label)}</span>
    ${link.desc ? `<span class="card-desc">${esc(link.desc)}</span>` : ''}
    ${stat ? `<span class="card-stat"><b>${esc(stat[0])}</b><span>${esc(stat[1])}</span></span>` : ''}
  </a>`;
}

const saved = savedData();
const stats = statsFor(saved && saved.data);
const links = (window.DEEPU_LINKS || []).filter(l => l.key !== 'index');
const GROUPS = [['public', 'Public'], ['private', 'Private']];

document.getElementById('groups').innerHTML = GROUPS.map(([g, label]) => `
  <section class="group" aria-label="${label}">
    <div class="group-label">${label}</div>
    <div class="cards">${links.filter(l => l.group === g).map(l => cardHTML(l, stats[l.key])).join('')}</div>
  </section>`).join('');

if (saved && saved.at) {
  const d = new Date(saved.at);
  document.getElementById('saved-note').textContent =
    `Figures saved in this browser ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}, ${d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})} — open a page to refresh them.`;
}

/* ── Visitor counter ─────────────────────────────────────────────────
   Each browser counts once per day. The visitor's own browser asks
   country.is for its two-letter country code; only that code reaches
   the Sheet (AppScript.gs → Visits tab), never an IP address. */
const VISIT_CACHE_KEY = 'deepu-visits-cache';
const VISIT_DAY_KEY   = 'deepu-visit-day';
const todayKey = () => new Date().toLocaleDateString('en-CA');
const regionName = (() => {
  try { const dn = new Intl.DisplayNames(['en'], { type: 'region' }); return code => dn.of(code); }
  catch (e) { return code => code; }
})();
const flagOf = code => /^[A-Z]{2}$/.test(code) && code !== 'ZZ'
  ? String.fromCodePoint(...[...code].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🌐';
const countryName = code => code === 'ZZ' ? 'Somewhere' : regionName(code);

function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

function renderVisits(saved, status) {
  const el = document.getElementById('visitors');
  const v = saved && saved.visits;
  const STATUS = {
    loading: 'Updating…',
    pending: 'Counter switches on once AppScript.gs is redeployed.',
    error:   'Could not reach the counter just now.',
  };
  const note = status ? STATUS[status] : `Updated ${fmtTime(saved.at)} · each browser counts once a day`;
  if (!v) {
    el.innerHTML = `<div class="visit-big"><span class="visit-wave" aria-hidden="true">👋</span><b>—</b><span>visits</span></div>
      <div class="visit-status">${note}</div>`;
    return;
  }
  const top = v.countries.slice(0, 5);
  el.innerHTML = `
    <div class="visit-big"><span class="visit-wave" aria-hidden="true">👋</span><b>${v.total.toLocaleString('en-US')}</b>
      <span>visit${v.total !== 1 ? 's' : ''} · ${v.countries.length} countr${v.countries.length !== 1 ? 'ies' : 'y'}</span></div>
    <div class="visit-flags">${top.map(c =>
      `<span class="visit-chip" title="${esc(countryName(c.country))}"><span aria-hidden="true">${flagOf(c.country)}</span>${esc(countryName(c.country))} <em>${c.count}</em></span>`).join('')}
      ${v.countries.length > top.length ? `<span class="visit-chip"><em>+${v.countries.length - top.length} more</em></span>` : ''}</div>
    <div class="visit-status">${note}</div>`;
}

async function lookupCountry() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 4000);
  try {
    const res = await fetch('https://api.country.is/', { signal: ctrl.signal });
    return (await res.json()).country || 'ZZ';
  } catch (e) {
    return 'ZZ';
  } finally {
    clearTimeout(timer);
  }
}

async function refreshVisits() {
  const cached = (() => { try { return JSON.parse(lsGet(VISIT_CACHE_KEY)); } catch (e) { return null; } })();
  renderVisits(cached, 'loading');
  const counted = lsGet(VISIT_DAY_KEY) === todayKey();
  const url = counted
    ? `${GS_URL}?action=visits`
    : `${GS_URL}?action=hit&country=${encodeURIComponent(await lookupCountry())}`;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    // A deployment older than the counter ignores ?action= and returns the tracker data instead.
    if (!data.visits) { renderVisits(cached, 'pending'); return; }
    if (!counted) lsSet(VISIT_DAY_KEY, todayKey());
    const fresh = { at: Date.now(), visits: data.visits };
    lsSet(VISIT_CACHE_KEY, JSON.stringify(fresh));
    renderVisits(fresh);
  } catch (e) {
    renderVisits(cached, 'error');
  }
}

refreshVisits();
</script>
</body>
</html>
